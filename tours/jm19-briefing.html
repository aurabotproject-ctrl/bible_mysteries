<script>
(function(){
"use strict";
let K=1.5;const W=1280,H=720,D=30,P=Math.PI,SC=4/3,DF=1.16; /* SC stretches the 30-beat script to 40 seconds; DF makes each picture's lines draw a little quicker than their slot, so it then rests */
const INK='#2e2419',SOFT='#5b4a35',RED='#8c2f1f',RUST='#b4552f',BRASS='#c9a227',GREEN='#3f7d4e',BLUE='#3d5a73',OCHRE='#c9a56a',CORK='#b98a52',WOOD='#5a3d28';
const SERIF='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>clamp((t-a)/(b-a)),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(i,s=0)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v)};
const cv=document.getElementById('c');cv.width=W*K;cv.height=H*K;let ctx=cv.getContext('2d');const mainCtx=ctx;let inSprite=false;

/* ---------- geometry ---------- */
const arc=(cx,cy,r,a0,a1,n=28)=>{const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o};
const ell=(cx,cy,rx,ry,a0=0,a1=2*P,n=32)=>{const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return o};
const bez=(a,b,c,d,n=20)=>{const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]])}return o};
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
const cat=(...a)=>[].concat(...a);
const L=(...p)=>p;
/* hand-drawn wobble, fixed per shape so it never flickers */
let SEED=1;
function sk(p,amp=.9){const o=[];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d/10));for(let j=0;j<n;j++){const u=j/n;o.push([a[0]+(b[0]-a[0])*u+(rnd(SEED++)-.5)*amp*2,a[1]+(b[1]-a[1])*u+(rnd(SEED++)-.5)*amp*2])}}o.push(p[p.length-1]);return o}
const S=(p,c,w,wob)=>{const q=wob===0?p:sk(p,wob||.8);q.c=c||INK;q.w=w||1;return q};
const F=(p,c,a)=>({p,c,a:a==null?.4:a});

/* ---------- little pictures: each returns {s:[strokes], f:[washes]} around (0,0) ---------- */
const M={};
M.shelf=k=>{const w=k.w||1000;return{s:[S(rect(-w/2,0,w,18),INK,1.3),S([[-w/2+30,18],[-w/2+30,44],[-w/2+60,18]],SOFT,.8),S([[w/2-30,18],[w/2-30,44],[w/2-60,18]],SOFT,.8),S([[-w/2,6],[w/2,6]],SOFT,.5)],f:[F(rect(-w/2,0,w,18),WOOD,.55)]}};
M.folder=k=>{const o=[[-70,-90],[-70,92],[70,92],[70,-90],[20,-90],[10,-104],[-42,-104],[-48,-90],[-70,-90]];
  return{s:[S(o,INK,1.25),S([[-70,-80],[70,-80]],SOFT,.55),S(rect(-48,56,96,26),SOFT,.6),S([[-56,-70],[-56,86]],SOFT,.4)],f:[F(o,k.c||OCHRE,.7)]}};
M.coinbag=()=>{const l=bez([-20,-48],[-82,-20],[-76,56],[0,58]),r=bez([0,58],[76,56],[82,-20],[20,-48]),t=[[-20,-48],[-28,-66],[-8,-57],[0,-68],[8,-57],[28,-66],[20,-48]];
  return{s:[S(cat(l,r),INK,1.2),S(t,INK,1),S([[-23,-44],[23,-44]],SOFT,.8),S(ell(0,12,20,20),RUST,.9),S([[0,-2],[0,26]],RUST,.6)],f:[F(cat(l,r),OCHRE,.6),F(ell(0,12,20,20),BRASS,.55)]}};
M.wall=k=>{const s=[],f=[];const W0=96,rows=5,bh=22;s.push(S(rect(-W0,-60,2*W0,rows*bh),INK,1.1));
  for(let r=1;r<rows;r++)s.push(S([[-W0,-60+r*bh],[W0,-60+r*bh]],SOFT,.55));
  for(let r=0;r<rows;r++)for(let c=1;c<6;c++){const x=-W0+c*32+(r%2?16:0);if(x<W0-4)s.push(S([[x,-60+r*bh],[x,-60+(r+1)*bh]],SOFT,.5))}

  const can=[];for(let i=0;i<=44;i++){const a=P+P*2*i/44,r=70+9*Math.sin(5*a+1);can.push([Math.cos(a)*r*1.08,-70+Math.sin(a)*r*.78])}
  s.push(S(tr,INK,1.2),S(can,GREEN,1.3),S([[-30,92],[-14,92]],INK,.8),S([[16,92],[34,92]],INK,.8));
  s.push(S(ell(26,-52,9,10),RED,1.4),S([[26,-62],[28,-70]],INK,.8));
  [[-34,-84,-20,-70],[0,-96,12,-84],[-48,-50,-36,-38],[40,-90,50,-78]].forEach(q=>s.push(S([[q[0],q[1]],[q[2],q[3]]],GREEN,.5)));
  f.push(F(can,GREEN,.38),F(tr,'#8a6a45',.6),F(ell(26,-52,9,10),RED,.85));return{s,f}};
M.ledger=k=>{const s=[],f=[];const lp=[[0,-70],[-130,-60],[-130,70],[0,80]],rp=[[0,-70],[130,-60],[130,70],[0,80]];

  for(let i=0;i<8;i++){const y=-42+i*15,wob=rnd(i,3)*14;s.push(S([[-118,y-4],[-18,y+2]],SOFT,.5),S([[18,y+2],[118,y-4]],SOFT,.5));
    if(k.rows!==false){s.push(S([[-116,y-4],[-116+30+wob,y-2]],INK,.7,.5),S([[26,y+3],[52+wob,y+2]],INK,.7,.5),S([[90,y-2],[110,y-3]],SOFT,.7,.4))}}

  f.push(F(cat(lp,[[0,-70]]),'#f3ead6',.8),F(cat(rp,[[0,-70]]),'#f3ead6',.8));return{s,f}};
M.fig=k=>{const s=[S(ell(0,-52,12,12),INK,1.2),S([[0,-40],[0,10]],INK,1.2),S([[0,-30],[-20,-8]],INK,1.1),S([[0,-30],[20,-8]],INK,1.1),S([[0,10],[-14,56]],INK,1.2),S([[0,10],[14,56]],INK,1.2)];return{s,f:[F(ell(0,-52,12,12),k.c||'#e8c9a0',.7)]}};
M.card=k=>{const w=k.w||200,h=k.h||90;return{s:[S(rect(-w/2,-h/2,w,h),INK,1.1)],f:[F(rect(-w/2,-h/2,w,h),'#f6eed9',.9)]}};
M.rays=k=>{const s=[];const n=k.n||16,rx1=k.rx1||150,ry1=k.ry1||150,rx2=k.rx2||220,ry2=k.ry2||220;for(let i=0;i<n;i++){const a=2*P*i/n,c=Math.cos(a),sn=Math.sin(a),e=i%2?0:.09;s.push(S([[c*rx1,sn*ry1],[c*rx2*(1+e),sn*ry2*(1+e)]],BRASS,1.2,.3))}return{s,f:[]}};
M.board=()=>{const o=rect(-150,-102,300,204),i=rect(-138,-90,276,180);return{s:[S(o,INK,1.6),S(i,SOFT,.6)],f:[F(rect(-150,-102,300,12),WOOD,.9),F(rect(-150,90,300,12),WOOD,.9),F(rect(-150,-90,12,180),WOOD,.9),F(rect(138,-90,12,180),WOOD,.9),F(i,'#e2b87a',.9)]}};
M.pcard=k=>{const s=[S(rect(-36,-24,72,48),INK,1)];[-10,2,14].forEach((y,i)=>s.push(S([[-26,y],[26-i*8,y]],SOFT,.5,.4)));s.push(S(ell(0,-24,4.2,4.2),RED,1.3));return{s,f:[F(rect(-36,-24,72,48),'#f6eed9',.95),F(ell(0,-24,4.2,4.2),RED,.95)]}};
M.xmark=()=>({s:[S([[-32,-24],[32,24]],RED,2.4,.6),S([[32,-24],[-32,24]],RED,2.4,.6)],f:[]});
M.string=k=>({s:[S(k.pts,RED,.8,.5)],f:[]});
M.magnifier=()=>({s:[S(ell(0,-20,38,38),INK,1.5),S(ell(0,-20,32,32),SOFT,.5),S([[26,6],[64,56]],INK,2.8,.4)],f:[F(ell(0,-20,38,38),'#bfd4dd',.35),F(rect(24,10,10,0),INK,0)]});
M.lock=()=>{const b=[[-40,-6],[40,-6],[40,62],[-40,62],[-40,-6]];return{s:[S(b,INK,1.3),S(arc(0,-6,26,P,2*P,16),INK,1.8),S([[-26,-6],[-26,-30]],INK,1.4),S([[26,-6],[26,-30]],INK,1.4),S(ell(0,24,7,7),INK,1.1),S([[0,28],[0,44]],INK,1.1)],f:[F(b,BRASS,.6)]}};
M.grid=k=>{const c=34,n=5,s=[],f=[];const blk=new Set(['0,0','4,0','0,4','4,4','2,2']),hl=new Set(['1,1','2,1','3,1']);
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){const x=-n*c/2+q*c,y=-n*c/2+r*c,key=q+','+r;s.push(S(rect(x,y,c,c),INK,.9,.5));if(blk.has(key))f.push(F(rect(x,y,c,c),INK,.75));else if(hl.has(key))f.push(F(rect(x,y,c,c),BRASS,.55));else f.push(F(rect(x,y,c,c),'#f6eed9',.9))}
  s.push(S([[-n*c/2+4,-n*c/2+9],[-n*c/2+9,-n*c/2+9]],SOFT,.5));return{s,f}};
M.qmark=()=>{const q=cat(bez([-30,-40],[-30,-90],[40,-100],[44,-48],16),bez([44,-48],[46,-14],[0,-8],[0,28],14));return{s:[S(q,RED,3.2,.8),S(ell(0,64,6,6),RED,2.2)],f:[]}};
M.seal=k=>{const p=[];for(let i=0;i<=40;i++){const a=2*P*i/40,r=70+(i%2?0:7);p.push([Math.cos(a)*r,Math.sin(a)*r])}const q=ell(0,0,52,52,0,2*P,28);
  return{s:[S(p,RED,1.6,.4),S(q,'#5f1d12',1),S(ell(0,0,40,40,0,2*P,24),'#5f1d12',.7)],f:[F(p,RED,.92)]}};

/* ---------- the wider picture library (one small drawing each, centred on 0,0) ---------- */
const GREY='#9a948a',SAND='#d9c08a',CREAM='#f6eed9',DARK='#3a2c20',WATER='#7fa6b8',SKIN='#e8c9a0';
const poly=(p,c,w,wob)=>S(p,c,w,wob),closed=p=>p.concat([p[0]]);
M.tomb=k=>{const hill=cat([[-190,96]],bez([-190,96],[-170,20],[-90,-70],[0,-76],12),bez([0,-76],[90,-70],[170,20],[190,96],12));
  const door=cat([[-42,96],[-42,10]],arc(0,10,42,P,2*P,14),[[42,10],[42,96]]),st=k.open?[96,60]:[0,48];
  const s=[S(hill,INK,1.3),S([[-210,96],[210,96]],SOFT,.9),S(door,INK,1.2),S(ell(st[0],st[1],50,50,0,2*P,26),INK,1.5),S(arc(st[0]-6,st[1]-4,34,P*.9,P*1.7,8),SOFT,.5)];
  const f=[F(closed(hill),SAND,.6),F(closed(door),k.open?DARK:'#c8b48c',k.open?.85:.4),F(ell(st[0],st[1],50,50,0,2*P,26),GREY,.7)];
  if(k.seal){s.push(S([[-14,42],[14,42]],RED,1.6),S(ell(0,48,10,10),RED,1.4));f.push(F(ell(0,48,10,10),RED,.9))}
  return{s,f}};
M.sun=k=>{const r=k.r||34,s=[S(ell(0,0,r,r,0,2*P,24),INK,1.3)];for(let i=0;i<12;i++){const a=2*P*i/12;s.push(S([[Math.cos(a)*(r+10),Math.sin(a)*(r+10)],[Math.cos(a)*(r+(i%2?22:30)),Math.sin(a)*(r+(i%2?22:30))]],BRASS,1.2,.3))}
  return{s,f:[F(ell(0,0,r,r,0,2*P,24),'#e9bf58',.8)]}};

M.moon=()=>{const o=arc(0,0,40,P*.55,P*1.45,20),e=o[o.length-1],b=o[0],i=bez(e,[-10,-26],[-10,26],b,14),c=cat(o,i);return{s:[S(c,INK,1.3)],f:[F(c,'#e9d9a0',.8)]}};
M.stars=k=>{const s=[];(k.pts||[[0,0],[40,-20],[-50,10],[80,14],[-20,-34]]).forEach(q=>{s.push(S([[q[0]-7,q[1]],[q[0]+7,q[1]]],BRASS,1.1),S([[q[0],q[1]-7],[q[0],q[1]+7]],BRASS,1.1))});return{s,f:[]}};
M.soldier=k=>{const s=[S(ell(0,-52,12,12),INK,1.2),S(arc(0,-54,15,P,2*P,10),INK,1.4),S([[0,-40],[0,10]],INK,1.2),S([[0,-30],[-18,-10]],INK,1.1),S([[0,-30],[22,-14]],INK,1.1),S([[0,10],[-14,56]],INK,1.2),S([[0,10],[14,56]],INK,1.2),S([[24,-92],[24,60]],INK,1),S([[24,-92],[20,-76],[28,-76],[24,-92]],INK,1),S(ell(-20,-10,9,15),RED,1.1)];

M.skyline=k=>{const bs=k.b||[[-150,60,70],[-96,92,50],[-52,70,60],[8,120,56],[64,78,60],[120,96,52],[170,56,56]],s=[S([[-190,60],[200,60]],SOFT,1)],f=[];
  bs.forEach((b,i)=>{const r=[[b[0]-b[2]/2,60],[b[0]-b[2]/2,60-b[1]],[b[0]+b[2]/2,60-b[1]],[b[0]+b[2]/2,60]];s.push(S(r,INK,1.1));f.push(F(closed(r),i%2?SAND:'#cdb68a',.6));

  drawStrokes([S([[150,106],[W-150,106]],'#7a5a35',.7,0),S([[150,111],[W-150,111]],'#7a5a35',.35,0)],ease(seg(t,.9,2.2)),2.2,.8);
  ctx.restore();
  writeLine('THE BIBLE INVESTIGATION BUREAU',W/2,66,26,seg(t,.2,1.6),seg(t,1.4,2.2),{},SOFT,false);
  writeLine('Department of Unsolved Antiquities',W/2,92,17,seg(t,1.0,2.0),seg(t,1.8,2.6),{},SOFT)}
/* geometry is built once */
ITEMS.forEach(it=>{if(M[it.m]&&!it.cache){SEED=(it.x*7+it.y*13+it.a[0]*31)|0;it.cache=M[it.m](it.k||{})}});
const PG=[];function layout(){PG.length=0;PAGES.forEach(([s,e,lines,hl])=>{const n=lines.length;let size=n===1?52:46;ctx.font='italic 700 '+size+'px '+SERIF;lines.forEach(l=>{size=Math.min(size,1120/(ctx.measureText(l).width/100))});size=Math.floor(Math.min(size,n===1?52:46));
  const gap=size*1.16,tot=lines.reduce((a,l)=>a+l.length,0),Wt=Math.min((e-s)*.7,tot*.085);let acc=0;
  PG.push({s,e,hl,L:lines.map((str,i)=>{const t0=s+acc/tot*Wt,t1=s+(acc+str.length)/tot*Wt;acc+=str.length;return{str,y:H-50-(n-1-i)*gap,size,t0,t1}})})})}
function itemSprite(it,g,s){if(it.sp&&it.spK===K)return it.sp;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const pt=q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])};
  g.s.forEach(a=>a.forEach(pt));g.f.forEach(f=>f.p.forEach(pt));if(x0>x1)return null;const pad=10;
  const w=(x1-x0)*s+2*pad,h=(y1-y0)*s+2*pad,c=document.createElement('canvas');c.width=Math.ceil(w*K);c.height=Math.ceil(h*K);
  const old=ctx;ctx=c.getContext('2d');ctx.setTransform(K,0,0,K,0,0);ctx.translate(pad-x0*s,pad-y0*s);ctx.scale(s,s);
  g.f.forEach(f=>wash(f.p,it.c&&it.m==='folder'?it.c:f.c,f.a));drawStrokes(g.s,1,3.4/s,1);ctx=old;
  it.sp={c,x:x0*s-pad,y:y0*s-pad,w,h};it.spK=K;return it.sp}
function drawItem(it,t){const[a0,a1]=it.a;if(t<a0)return;let al=1;if(it.o){al=1-seg(t,it.o[0],it.o[1]);if(al<=0)return}
  if(it.m==='txt'){ctx.save();ctx.globalAlpha*=al;if(it.ap){ctx.globalAlpha*=ease(seg(t,a0,a0+.5));if(it.r){ctx.translate(it.x,it.y);ctx.rotate(it.r);writeLine(it.str,0,0,it.size,1,1,{},it.col)}else writeLine(it.str,it.x,it.y,it.size,1,1,{},it.col);ctx.restore();return}if(it.r){ctx.translate(it.x,it.y);ctx.rotate(it.r);writeLine(it.str,0,0,it.size,seg(t,a0,a1),seg(t,a1-.1,a1+.8),{},it.col)}else writeLine(it.str,it.x,it.y,it.size,seg(t,a0,a1),seg(t,a1-.1,a1+.8),{},it.col);ctx.restore();return}
  const g=it.cache;if(!g)return;let s=it.s||1,x=it.x,y=it.y,r=it.r||0;
  if(it.ap){const q=ease(seg(t,a0,a0+.45)),sp=itemSprite(it,g,s);if(sp){ctx.save();ctx.globalAlpha=al*q;ctx.globalCompositeOperation='multiply';ctx.translate(x,y);ctx.rotate(r);const z=1.05-.05*q;ctx.scale(z,z);ctx.drawImage(sp.c,sp.x,sp.y,sp.w,sp.h);ctx.restore()}return}
  if(!it.pop&&!r&&t>=a0+(a1-a0)/DF){const sp=itemSprite(it,g,s);if(sp){ctx.save();ctx.globalAlpha=al;ctx.globalCompositeOperation='multiply';ctx.drawImage(sp.c,x+sp.x,y+sp.y,sp.w,sp.h);ctx.restore();return}}
  ctx.save();ctx.translate(x,y);ctx.rotate(r);
  if(it.pop){const q=ease(seg(t,a0,a0+.2)),sc=lerp(1.7,1,q);ctx.scale(s*sc,s*sc);ctx.globalAlpha=al*clamp(q*1.6);
    if(it.m==='seal'){drawStrokes(g.s,1,4/s,al*q);g.f.forEach(f=>wash(f.p,f.c,f.a*q));
      ctx.font='italic 700 38px '+SERIF;ctx.fillStyle='#f1d3ae';ctx.globalAlpha=al*q;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('B.I.B.',0,2);ctx.textAlign='start'}
    else{drawStrokes(g.s,1,3.6/s,al*clamp(q*1.6));ctx.fillStyle=(it.k&&it.k.col)||RED;ctx.globalAlpha=al*clamp(q*1.6);ctx.font='700 '+it.size+'px '+SERIF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.str,0,3);ctx.textAlign='start'}
    ctx.restore();ctx.globalAlpha=1;return}
  const p=ease(seg(t,a0,a0+(a1-a0)/DF)),fa=seg(p,.5,1);ctx.scale(s,s);
  g.f.forEach(f=>wash(f.p,it.c&&it.m==='folder'?it.c:f.c,f.a*fa*al));
  drawStrokes(g.s,p,3.4/s,al);ctx.restore();ctx.globalAlpha=1}
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.setTransform(K,0,0,K,0,0);writing=false;ctx.globalAlpha=1;
  frame(t);ITEMS.forEach(it=>drawItem(it,t));
  PG.forEach(pg=>{if(t<pg.s||t>pg.e+.6)return;ctx.save();ctx.globalAlpha*=1-seg(t,pg.e,pg.e+.55);pg.L.forEach(l=>writeLine(l.str,W/2,l.y,l.size,seg(t,l.t0,l.t1),seg(t,l.t1-.1,l.t1+.9),pg.hl,INK));ctx.restore()});
  ctx.fillStyle='rgba(140,47,31,.35)';ctx.fillRect(30,H-34,(W-60)*t/D,2);
  if(AC&&scratch){const on=writing||drawing(t);if(on!==scOn){scOn=on;scratch.gain.setTargetAtTime(0,AC.currentTime,.05)}}}
let scOn=false;
const drawing=t=>ITEMS.some(it=>!it.pop&&!it.ap&&it.m!=='txt'&&t>=it.a[0]&&t<it.a[1]&&(!it.o||t<it.o[0]));

/* ---------- sound: quill, paper, wax, locks — all synthesised ---------- */
let AC,master,noiseBuf,scratch,muted=false;
function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=.85;const cmp=AC.createDynamicsCompressor();master.connect(cmp);cmp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=3400;f.Q.value=1.4;scratch=AC.createGain();scratch.gain.value=0;s.connect(f);f.connect(scratch);scratch.connect(master);s.start();
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=9;lg.gain.value=700;lfo.connect(lg);lg.connect(f.frequency);lfo.start()}
const now=()=>AC.currentTime;
function tone(f,d,v,type,delay,att,sweep){const t=now()+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function nz(d,type,f0,f1,v,delay){const t=now()+(delay||0),s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const SF={
 rustle(){nz(.5,'bandpass',2600,5200,.16);nz(.35,'highpass',4000,6000,.08,.1)},
 page(){nz(.35,'bandpass',1800,4200,.2)},
 thud(){tone(95,.55,.55,'sine',0,.005,45);nz(.12,'lowpass',900,200,.35)},
 stamp(){tone(120,.4,.45,'sine',0,.004,50);nz(.08,'lowpass',1400,300,.4)},
 click(){nz(.04,'highpass',2500,2500,.5);tone(1500,.1,.14,'square')},
 clunk(){tone(180,.18,.3,'square',0,.003,90);nz(.05,'bandpass',1800,1800,.3)},
 creak(){tone(180,1.1,.07,'sawtooth',0,.2,130);tone(184,1.1,.05,'sawtooth',0,.2,138)},
 pad(f,d=9,v=.03){[1,1.5,2].forEach((m,i)=>tone(f*m*(1+i*.002),d,v/(i+1),'sine',0,d*.4))},
 chime(f,v=.14){tone(f,2.6,v,'sine',0,.01);tone(f*2.76,1.4,v*.35,'sine',0,.01);tone(f*5.4,.8,v*.15,'sine',0,.01)},
 xs(){nz(.14,'bandpass',3000,6000,.22)},
 tick(){tone(1800,.04,.1,'square')}
};
function autoCues(){const c=[[.15,()=>SF.pad(146.8)]],pad=[146.8,130.8,116.5,110,98,123.5];
  PAGES.forEach((p,i)=>{c.push([Math.max(.1,p[0]-.3),i%2?'page':'rustle']);if(i)c.push([p[0],()=>SF.pad(pad[i%6],7,.03)])});
  ITEMS.forEach(it=>{if(it.pop&&it.m==='stamp')c.push([it.a[0],'stamp']);else if(it.pop&&it.m==='seal'){c.push([it.a[0],'thud']);c.push([it.a[0]+.1,()=>{SF.chime(392,.16);SF.chime(587,.1)}]);c.push([it.a[0]+.6,()=>SF.pad(98,8,.05)])}else if(it.m==='lock')c.push([it.a[0]+.7,'clunk'])});
  c.sort((a,b)=>a[0]-b[0]);return c}
/* sound effects are switched off: only the soft music (pad + closing chime) plays */
['rustle','page','thud','stamp','click','clunk','creak','xs','tick'].forEach(k=>{SF[k]=()=>{}});
const CUES=typeof CASE_CUES!=='undefined'?CASE_CUES:autoCues();
let cues=[];

/* ---------- play ---------- */
const ov=document.getElementById('ov'),ctl=document.getElementById('ctl'),muteB=document.getElementById('mute'),again=document.getElementById('again');
let t0=0,running=false,raf=0;
function start(sound){cancelAnimationFrame(raf);if(sound){try{if(!AC)initAudio();AC.resume();muted=false;master.gain.value=.85}catch(e){}}else{try{if(AC)master.gain.value=0}catch(e){}}
  muteB.style.display=AC&&sound?'':'none';muteB.textContent=sound?'🔊':'🔇';
  cues=CUES.map(c=>({t:c[0],f:typeof c[1]==='string'?SF[c[1]]:c[1],d:0}));ov.style.display='none';ctl.style.display='flex';again.style.display='none';t0=performance.now();running=true;raf=requestAnimationFrame(loop)}
let lastR=0,slow=0;
function setK(k){K=k;cv.width=W*K;cv.height=H*K;ctx=mainCtx;buildBg();LS.clear()}
function loop(n){if(!running)return;const t=(n-t0)/1000/SC;if(AC&&!muted)cues.forEach(c=>{if(!c.d&&t>=c.t){c.d=1;try{c.f()}catch(e){}}});
  if(n-lastR>=30||t>=D){lastR=n;const a=performance.now();render(Math.min(t,D));const cost=performance.now()-a;
    /* a slow machine drops to a lighter picture rather than stuttering */
    if(cost>20){if(++slow>=12&&K>1){setK(1);slow=0}}else slow=Math.max(0,slow-1)}
  if(t>=D){running=false;again.style.display='';if(AC&&scratch)scratch.gain.value=0;return}raf=requestAnimationFrame(loop)}
document.getElementById('go').onclick=()=>start(true);
document.getElementById('mutego').onclick=()=>start(false);
again.onclick=()=>start(!!AC&&!muted);
muteB.onclick=()=>{if(!AC)return;muted=!muted;master.gain.value=muted?0:.85;muteB.textContent=muted?'🔇':'🔊'};
const q=new URLSearchParams(location.search).get('t');
const ready=()=>{layout();if(q!==null){ov.style.display='none';render(+q)}else render(0)};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(ready,ready);
window.__render=t=>{ov.style.display='none';render(t)};
})();
