<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jerusalem c. AD 33 — First Person Walkthrough</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dcc0;touch-action:none;
    font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;color:#3a2d1c;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;}
  #leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* map-style cartouche label */
  .label{
    position:absolute;transform:translate(-50%,-100%);
    background:#f0e4c4;border:2px solid #3a2d1c;border-radius:5px;
    padding:5px 11px;font-size:15px;letter-spacing:.10em;font-weight:700;
    text-transform:uppercase;white-space:pre;line-height:1.15;text-align:center;
    box-shadow:0 2px 0 rgba(58,45,28,.35), inset 0 0 0 1px #f7eed6;
    opacity:0;transition:opacity .22s ease;
  }
  .label.on{opacity:1;}

  /* HUD info panel — drops down on the left when near a labeled place */
  #hud{
    position:absolute;left:22px;top:104px;width:300px;max-width:calc(100vw - 44px);
    background:#f0e4c4;border:2px solid #3a2d1c;border-radius:6px;
    box-shadow:0 3px 0 rgba(58,45,28,.35),inset 0 0 0 1px #f7eed6;
    pointer-events:auto;overflow:hidden;
    opacity:0;transform:translateY(-18px);
    transition:opacity .28s ease, transform .28s ease;
    z-index:5;
  }
  #hud.open{opacity:1;transform:translateY(0);}
  #hud .hud-img{display:block;width:100%;height:150px;object-fit:cover;border-bottom:2px solid #3a2d1c;}
  #hud .hud-body{padding:10px 14px 13px;}
  #hud .hud-body h2{margin:0 0 6px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;}
  #hud .hud-body p{margin:0;font-size:12.5px;line-height:1.5;letter-spacing:.02em;}
  #hud .hud-close{
    position:absolute;top:6px;right:6px;width:24px;height:24px;line-height:22px;
    text-align:center;background:#f0e4c4;border:2px solid #3a2d1c;border-radius:50%;
    font-size:15px;font-family:Georgia,serif;color:#3a2d1c;cursor:pointer;
    box-shadow:0 2px 0 rgba(58,45,28,.35);
  }
  #hud .hud-close:hover{background:#e4d5ab;}

  #titlecard{
    position:absolute;left:22px;top:18px;background:#f0e4c4;border:2px solid #3a2d1c;
    border-radius:5px;padding:10px 18px 12px;box-shadow:0 2px 0 rgba(58,45,28,.35),inset 0 0 0 1px #f7eed6;
  }
  #titlecard h1{margin:0;font-size:23px;letter-spacing:.13em;font-weight:700;}
  #titlecard div{font-size:13px;font-style:italic;opacity:.8;margin-top:2px;letter-spacing:.05em;}

  #help{
    position:absolute;left:22px;bottom:20px;background:#f0e4c4;border:2px solid #3a2d1c;
    border-radius:5px;padding:9px 14px;font-size:12.5px;line-height:1.65;letter-spacing:.03em;
    box-shadow:0 2px 0 rgba(58,45,28,.35),inset 0 0 0 1px #f7eed6;max-width:250px;
  }
  #help b{letter-spacing:.08em;}
  #compass{
    position:absolute;right:26px;bottom:24px;width:74px;height:74px;
  }
  #vignette{position:absolute;inset:0;box-shadow:inset 0 0 190px rgba(90,70,40,.45);}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#e8dcc0;font-size:19px;letter-spacing:.16em;text-transform:uppercase;z-index:9;}

  /* on-screen touch controls — hidden unless a touch device is detected */
  #touchControls{display:none;}
  body.touch #help{display:none;}
  body.touch #touchControls{display:block;}

  .tc-joy{
    position:absolute;left:20px;bottom:26px;width:130px;height:130px;
    pointer-events:auto;touch-action:none;
  }
  .tc-joy-base{
    position:absolute;inset:0;border-radius:50%;
    background:rgba(240,228,196,.5);border:2px solid #3a2d1c;
    box-shadow:0 2px 0 rgba(58,45,28,.3),inset 0 0 0 1px rgba(247,238,214,.6);
  }
  .tc-joy-knob{
    position:absolute;width:56px;height:56px;left:50%;top:50%;margin:-28px 0 0 -28px;
    border-radius:50%;background:#f0e4c4;border:2px solid #3a2d1c;
    box-shadow:0 2px 0 rgba(58,45,28,.35);
  }
  .tc-buttons{
    position:absolute;right:24px;bottom:112px;display:flex;flex-direction:column;gap:11px;
    pointer-events:auto;
  }
  .tc-btn{
    width:52px;height:52px;border-radius:50%;touch-action:none;
    background:#f0e4c4;border:2px solid #3a2d1c;box-shadow:0 2px 0 rgba(58,45,28,.35);
    font-family:Georgia,serif;font-size:11px;font-weight:700;letter-spacing:.03em;
    display:flex;align-items:center;justify-content:center;color:#3a2d1c;
  }
  .tc-btn.active{background:#d8c692;}
  .tc-hint{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);
    background:#f0e4c4;border:2px solid #3a2d1c;border-radius:5px;padding:7px 13px;
    font-size:11.5px;letter-spacing:.04em;box-shadow:0 2px 0 rgba(58,45,28,.35);
    opacity:.95;transition:opacity 1s ease;white-space:nowrap;
  }
  .tc-hint.faded{opacity:0;}
</style>
</head>
<body>

<div id="loading">Drawing the map…</div>

<div id="ui">
  <svg id="leaders"></svg>
  <div id="labels"></div>
  <div id="titlecard"><h1>JERUSALEM</h1><div>c. AD 33</div></div>
  <div id="hud">
    <button id="hudClose" class="hud-close" aria-label="Close">&times;</button>
    <img id="hudImg" class="hud-img" src="" alt="">
    <div class="hud-body">
      <h2 id="hudTitle"></h2>
      <p id="hudText"></p>
    </div>
  </div>
  <div id="help">
    <b>↑ ↓</b> walk forward / back<br>
    <b>← →</b> turn &nbsp;·&nbsp; <b>A D</b> step sideways<br>
    <b>Shift</b> run &nbsp;·&nbsp; <b>Mouse</b> click to look<br>
    <b>M</b> map view &nbsp;·&nbsp; <b>Esc</b> release mouse &nbsp;·&nbsp; <b>R</b> reset
  </div>
  <svg id="compass" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="33" fill="none" stroke="#3a2d1c" stroke-width="2"/>
    <g id="needle">
      <polygon points="50,14 57,50 50,44 43,50" fill="#3a2d1c"/>
      <polygon points="50,86 43,50 50,56 57,50" fill="#3a2d1c" opacity=".35"/>
    </g>
    <text x="50" y="10" text-anchor="middle" font-size="14" font-family="Georgia,serif" fill="#3a2d1c">N</text>
  </svg>
  <div id="vignette"></div>

  <div id="touchControls">
    <div id="tcHint" class="tc-hint">Drag anywhere to look around</div>
    <div id="tcJoy" class="tc-joy">
      <div class="tc-joy-base"></div>
      <div id="tcJoyKnob" class="tc-joy-knob"></div>
    </div>
    <div class="tc-buttons">
      <div id="tcRun" class="tc-btn" aria-label="Run">RUN</div>
      <div id="tcMap" class="tc-btn" aria-label="Map view">MAP</div>
      <div id="tcReset" class="tc-btn" aria-label="Reset">&#8635;</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   JERUSALEM c. AD 33 — walkable illustrated map
   Everything is procedural: no external assets.
   ============================================================ */

/* ---------- palette (lifted from the parchment map) ---------- */
const C = {
  ink:        0x3d2f1d,
  parchment:  0xdccba0,
  ground:     0xd6c398,
  groundDark: 0xc2ac7c,
  stone:      0xd3c19a,
  stoneDeep:  0xc0aa80,
  house:      0xd9c69c,
  house2:     0xd0bb8e,
  roof:       0xc8b184,
  terracotta: 0xb87a4e,
  temple:     0xdfd0ab,
  wood:       0x7a6039,
  olive:      0x71804a,
  oliveDark:  0x5d6b3c,
  cypress:    0x53663a,
  bush:       0x7d8a52,
  rock:       0xcbb992,
  red:        0xc0392b,
  blue:       0x2b6fa8,
  sky:        0xe8dcc0
};

/* ---------- seeded RNG so the city is the same every visit ---------- */
let _s = 20260910;
function rnd(){ _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; }
function rr(a,b){ return a + (b-a)*rnd(); }

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(C.sky);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe0d1a8, 130, 430);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 900);

/* ---------- toon ramp: 3 flat bands, like ink-wash shading ---------- */
function ramp(levels){
  const t = new THREE.DataTexture(new Uint8Array(levels), levels.length, 1, THREE.LuminanceFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const GRAD  = ramp([ 92, 158, 214, 255]);
const GRAD2 = ramp([ 78, 142, 200, 246]);

/* ---------- shared colored-pencil crosshatch texture: gives every surface
   a hand-drawn pencil-shading look instead of soft blotchy patches ---------- */
function grainTexture(repeat){
  const s = 512, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,s,s);

  // layered directional hatch strokes, like colored-pencil shading —
  // several passes at different angles/tones build up the "pencil" texture
  function hatchPass(count, angle, len, width, alpha, color){
    g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = width;
    const spread = 0.35; // slight jitter around the base angle per stroke
    for(let i=0;i<count;i++){
      const x = Math.random()*s, y = Math.random()*s;
      const a = angle + (Math.random()-0.5)*spread;
      const l = len*(0.6+Math.random()*0.8);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.lineTo(x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
  }
  // warm pencil strokes, one direction
  hatchPass(900, 0.55, 20, 1, 0.05, '#a9824f');
  // cool pencil strokes, crossing the first for a crosshatch weave
  hatchPass(700, 2.1, 18, 1, 0.045, '#7d6a86');
  // fine tight crosshatch for texture up close
  hatchPass(1400, 1.15, 8, 1, 0.05, '#8d764c');
  // sparse light strokes to break up flatness (like pencil highlights)
  hatchPass(300, -0.3, 14, 1, 0.05, '#fff6df');

  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  return t;
}
const BUILD_GRAIN = grainTexture(1.4);

function toon(color, grad){
  return new THREE.MeshToonMaterial({ color: color, gradientMap: grad || GRAD, map: BUILD_GRAIN });
}

/* ---------- lighting: soft, flat, no shadows (illustration look) ---------- */
scene.add(new THREE.AmbientLight(0xf6e6c6, 0.34));
scene.add(new THREE.HemisphereLight(0xffeec6, 0x9d8355, 0.22));
const sun = new THREE.DirectionalLight(0xfff0cf, 0.52);
sun.position.set(-90, 120, 70);
scene.add(sun);

/* ---------- ink outlines ---------- */
const inkMat = new THREE.LineBasicMaterial({ color: C.ink, transparent:true, opacity:0.88 });
const edgeCache = new Map();
function outline(mesh, thresh){
  const key = mesh.geometry.uuid + '|' + (thresh||24);
  let eg = edgeCache.get(key);
  if(!eg){ eg = new THREE.EdgesGeometry(mesh.geometry, thresh||24); edgeCache.set(key, eg); }
  mesh.add(new THREE.LineSegments(eg, inkMat));
  return mesh;
}
function block(w,h,d, color, grad){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), toon(color,grad));
  return outline(m);
}

/* a proper gable roof: ridge runs along local X, eaves at y = 0 */
function gable(len, width, rise, color){
  const g = new THREE.CylinderGeometry(1,1,1,3);
  g.rotateZ(Math.PI/2);          // prism axis now runs along X
  g.rotateX(-Math.PI/2);         // apex now points up
  g.translate(0, 0.5, 0);        // eaves on y = 0, apex at y = 1.5
  g.scale(len, rise/1.5, width/1.7320508);
  return outline(new THREE.Mesh(g, toon(color, GRAD2)));
}

/* ============================================================
   COLLISION + WALKABLE SURFACES
   ============================================================ */
const BLOCKERS  = [];   // rotated rectangles you cannot walk through
const PLATFORMS = [];   // walkable surfaces: flat slabs and sloped stairs
const PR = 0.45;        // player radius

function addBlocker(cx,cz,hw,hh,rot,yMax){
  BLOCKERS.push({cx,cz,hw,hh,c:Math.cos(rot||0),s:Math.sin(rot||0),
                 yMax:(yMax===undefined ? Infinity : yMax)});
}
/* surface height ramps linearly from y0 (local -hh edge) to y1 (local +hh edge) */
function addPlatform(cx,cz,hw,hh,rot,y0,y1){
  PLATFORMS.push({cx,cz,hw,hh,c:Math.cos(rot||0),s:Math.sin(rot||0),
                  y0:y0, y1:(y1===undefined ? y0 : y1)});
}
/* world position of a point given in a rotated group's local frame */
function worldOf(cx,cz,rot,lx,lz){
  const c = Math.cos(rot), s = Math.sin(rot);
  return [cx + lx*c + lz*s, cz - lx*s + lz*c];
}
function blockedAt(x,z,feetY){
  for(let i=0;i<BLOCKERS.length;i++){
    const o = BLOCKERS[i];
    if(feetY >= o.yMax - 0.06) continue;
    const dx = x-o.cx, dz = z-o.cz;
    if(Math.abs(dx) + Math.abs(dz) > o.hw + o.hh + 2) continue;   // cheap reject
    const lx = dx*o.c - dz*o.s, lz = dx*o.s + dz*o.c;
    if(Math.abs(lx) < o.hw + PR && Math.abs(lz) < o.hh + PR) return true;
  }
  return false;
}
function floorAt(x,z,prevFeet){
  let f = heightAt(x,z);
  for(let i=0;i<PLATFORMS.length;i++){
    const p = PLATFORMS[i];
    const dx = x-p.cx, dz = z-p.cz;
    if(Math.abs(dx) + Math.abs(dz) > p.hw + p.hh + 2) continue;
    const lx = dx*p.c - dz*p.s, lz = dx*p.s + dz*p.c;
    if(Math.abs(lx) <= p.hw && Math.abs(lz) <= p.hh){
      const h = p.y0 + (p.y1-p.y0) * ((lz + p.hh) / (2*p.hh));
      if(h > f && h <= prevFeet + 0.9) f = h;   // you can step up, not teleport up
    }
  }
  return f;
}

/* ============================================================
   TERRAIN
   ============================================================ */
const GOL = { x:-62, z:-46 };            // Golgotha mound
const CITY_C = { x:64, z:0 };            // city centre

function smoothstep(a,b,x){ x=Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); }

/* flatten mask for a rounded rectangle region */
function rectMask(x,z,cx,cz,hw,hh,feather){
  const dx = Math.max(Math.abs(x-cx)-hw, 0);
  const dz = Math.max(Math.abs(z-cz)-hh, 0);
  const d  = Math.hypot(dx,dz);
  return 1 - smoothstep(0, feather, d);
}

function heightAt(x,z){
  // gentle rolling desert
  let h = Math.sin(x*0.021)*1.5 + Math.cos(z*0.026)*1.25 + Math.sin((x+z)*0.011)*1.8;
  // Golgotha: the skull hill
  const d = Math.hypot(x-GOL.x, z-GOL.z);
  h += 17.5 * Math.exp(-(d*d)/(2*20*20));
  // small ridge behind it
  const d2 = Math.hypot(x-GOL.x+34, z-GOL.z-12);
  h += 7 * Math.exp(-(d2*d2)/(2*24*24));
  // city sits on a level plateau
  const cm = rectMask(x,z, CITY_C.x, CITY_C.z, 52, 50, 26);
  h = h*(1-cm) + 3.0*cm;
  // garden hollow is flat
  const gm = rectMask(x,z, -62, 28, 26, 20, 18);
  h = h*(1-gm) + 0.6*gm;
  return h;
}

const GSIZE = 480, GSEG = 190;
const gGeo = new THREE.PlaneGeometry(GSIZE, GSIZE, GSEG, GSEG);
gGeo.rotateX(-Math.PI/2);
{
  const p = gGeo.attributes.position;
  for(let i=0;i<p.count;i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  gGeo.computeVertexNormals();
}

/* procedural ground texture: colored-pencil crosshatch shading */
function parchmentTexture(){
  const s = 1024, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#dbc99f'; g.fillRect(0,0,s,s);

  function hatchPass(count, angle, len, width, alpha, color){
    g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = width;
    const spread = 0.35;
    for(let i=0;i<count;i++){
      const x = Math.random()*s, y = Math.random()*s;
      const a = angle + (Math.random()-0.5)*spread;
      const l = len*(0.6+Math.random()*0.8);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.lineTo(x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
  }
  // broad warm strokes, one direction — like pencil shading laid down first
  hatchPass(3600, 0.55, 34, 1, 0.045, '#b79b6b');
  // cooler crossing strokes for a woven crosshatch feel
  hatchPass(2800, 2.15, 30, 1, 0.04, '#9c8355');
  // tighter fine crosshatch for close-up texture
  hatchPass(5200, 1.2, 14, 1, 0.045, '#8d764c');
  // light strokes to keep it from reading too dark/uniform
  hatchPass(900, -0.25, 24, 1, 0.045, '#f0e2bd');

  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(7,7);
  return t;
}
const groundMat = new THREE.MeshToonMaterial({ color: C.ground, gradientMap: GRAD, map: parchmentTexture() });
const ground = new THREE.Mesh(gGeo, groundMat);
scene.add(ground);

/* ============================================================
   CITY WALL
   ============================================================ */
const WALL = [
  [ 12,-22],[ 30,-50],[ 72,-58],[114,-32],[118, 10],[ 98, 50],[ 52, 58],[ 16, 28]
];
const GATE = { x: 11.4, z: -5 };   // sits on the west wall segment [16,28]→[12,-22]

const WALL_H = 7.5, WALL_T = 2.6;

function wallSegment(ax,az,bx,bz, skipC, skipHalf){
  const dx = bx-ax, dz = bz-az, len = Math.hypot(dx,dz);
  const ang = Math.atan2(dx,dz);
  const pieces = [];
  if(skipC){
    // split around the gateway
    const t = ((skipC.x-ax)*dx + (skipC.z-az)*dz) / (len*len);
    const cut = skipHalf/len;
    pieces.push([0, Math.max(0,t-cut)], [Math.min(1,t+cut), 1]);
  } else pieces.push([0,1]);

  pieces.forEach(([t0,t1])=>{
    const L = (t1-t0)*len;
    if(L < 0.5) return;
    const mx = ax + dx*(t0+t1)/2, mz = az + dz*(t0+t1)/2;
    const y  = heightAt(mx,mz);
    const w = block(WALL_T, WALL_H, L, C.stone);
    w.position.set(mx, y + WALL_H/2 - 0.6, mz);
    w.rotation.y = ang;
    scene.add(w);
    addBlocker(mx, mz, WALL_T/2, L/2, ang);
    // crenellations
    const n = Math.max(1, Math.floor(L/3.4));
    for(let i=0;i<n;i++){
      const tt = t0 + (t1-t0)*((i+0.5)/n);
      const cx = ax+dx*tt, cz = az+dz*tt;
      const cr = block(WALL_T*0.92, 1.5, 1.7, C.stoneDeep);
      cr.position.set(cx, heightAt(cx,cz) + WALL_H - 0.6 + 0.75, cz);
      cr.rotation.y = ang;
      scene.add(cr);
    }
  });
}

for(let i=0;i<WALL.length;i++){
  const a = WALL[i], b = WALL[(i+1)%WALL.length];
  const isGateEdge = (i === WALL.length-1);   // [16,28] → [12,-22]
  wallSegment(a[0],a[1],b[0],b[1], isGateEdge ? GATE : null, 3.2);
  // corner tower
  const ty = heightAt(a[0],a[1]);
  const tw = block(4.6, WALL_H+2.2, 4.6, C.stone);
  tw.position.set(a[0], ty + (WALL_H+2.2)/2 - 0.6, a[1]);
  scene.add(tw);
  addBlocker(a[0], a[1], 2.3, 2.3, 0);
}

/* --- the GATE: two towers + arch --- */
(function gate(){
  const y = heightAt(GATE.x, GATE.z);
  const rot = Math.atan2(12-16, -22-28);      // align with west wall
  const g = new THREE.Group();
  g.position.set(GATE.x, y, GATE.z);
  g.rotation.y = rot;

   BUILDINGS
   ============================================================ */
function pointInPoly(x,z,poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], zi=poly[i][1], xj=poly[j][0], zj=poly[j][1];
    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside;
  }
  return inside;
}
/* shrink test: keep houses off the wall */
function wellInside(x,z,margin){
  for(let k=0;k<10;k++){
    const a = k/10*Math.PI*2;
    if(!pointInPoly(x+Math.cos(a)*margin, z+Math.sin(a)*margin, WALL)) return false;
  }
  return true;
}

/* a plain Jerusalem house: flat roof + parapet, sometimes pitched */
function house(x,z, w,d,h, pitched){
  const g = new THREE.Group();
  const y = heightAt(x,z);
  g.position.set(x,y,z);
  const rot = rr(-0.12,0.12);
  g.rotation.y = rot;
  addBlocker(x, z, w/2, d/2, rot);

  const body = block(w,h,d, rnd()<0.5 ? C.house : C.house2);
  body.position.y = h/2;
  g.add(body);

  if(pitched){
    const r = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78, 2.4, 4), toon(C.roof, GRAD2));
    r.rotation.y = Math.PI/4; r.position.y = h + 1.2;
    outline(r); g.add(r);
  } else {
    const slab = block(w*1.06, 0.45, d*1.06, C.roof);
    slab.position.y = h + 0.2; g.add(slab);
    // low parapet
    const p1 = block(w*1.06, 0.7, 0.28, C.roof); p1.position.set(0,h+0.6, d*0.53); g.add(p1);
    const p2 = p1.clone(); p2.position.z = -d*0.53; g.add(p2);
  }
  // doorway
  const dr = block(0.9, 1.6, 0.16, 0x6b5334);
  dr.position.set(rr(-w*0.2,w*0.2), 0.8, d/2 + 0.06);
  g.add(dr);
  // a couple of window dots
  for(let i=0;i<2;i++){
    const wdo = block(0.42,0.42,0.12, 0x7d6440);
    wdo.position.set(rr(-w*0.3,w*0.3), h*0.68, d/2+0.05);
    g.add(wdo);
  }
  scene.add(g);
  return g;
}

   where the red path comes down from Golgotha */
const GARDEN_GAPS = [[0.02, 0.58], [4.60, 5.16]];

(function garden(){
  // enclosing dry-stone wall
  const N = 64;
  for(let i=0;i<N;i++){
    const a  = i/N*Math.PI*2;
    if(GARDEN_GAPS.some(([g0,g1]) => a > g0 && a < g1)) continue;
    const a2 = (i+1)/N*Math.PI*2;
    const x1 = GARDEN.x + Math.cos(a)*GARDEN.rx,  z1 = GARDEN.z + Math.sin(a)*GARDEN.rz;
    const x2 = GARDEN.x + Math.cos(a2)*GARDEN.rx, z2 = GARDEN.z + Math.sin(a2)*GARDEN.rz;
    const mx=(x1+x2)/2, mz=(z1+z2)/2, len=Math.hypot(x2-x1,z2-z1)+0.25;
    const w = block(0.75, 1.5, len, C.stoneDeep);
    const wr = Math.atan2(x2-x1, z2-z1);
    w.position.set(mx, heightAt(mx,mz)+0.7, mz);
    w.rotation.y = wr;
    scene.add(w);
    addBlocker(mx, mz, 0.375, len/2, wr);
  }
  // orchard
  for(let i=0;i<34;i++){
    const a = rnd()*Math.PI*2, r = Math.sqrt(rnd());
    const x = GARDEN.x + Math.cos(a)*GARDEN.rx*0.82*r;
    const z = GARDEN.z + Math.sin(a)*GARDEN.rz*0.82*r;
    if(Math.hypot(x-TOMB.x, z-TOMB.z) < 11) continue;
    oliveTree(x,z);
  }
  for(let i=0;i<16;i++){
    const a = rnd()*Math.PI*2, r = Math.sqrt(rnd());
    const x = GARDEN.x + Math.cos(a)*GARDEN.rx*0.9*r;
    const z = GARDEN.z + Math.sin(a)*GARDEN.rz*0.9*r;
    if(Math.hypot(x-TOMB.x, z-TOMB.z) < 10) continue;
    shrub(x,z);
  }
  cypress(GARDEN.x-20, GARDEN.z-13); cypress(GARDEN.x-24, GARDEN.z-6);
  cypress(GARDEN.x+16, GARDEN.z-15); cypress(GARDEN.x+13, GARDEN.z+12);
})();

  }
})();

/* ============================================================
   DASHED PATHS ON THE GROUND
   ============================================================ */
function catmull(pts){
  return new THREE.CatmullRomCurve3(pts.map(p=> new THREE.Vector3(p[0],0,p[1])), false, 'catmullrom', 0.5);
}
function dashedPath(pts, color, dashLen, gapLen, width){
  const curve = catmull(pts);
  const total = curve.getLength();
  const geo = new THREE.BoxGeometry(width, 0.12, dashLen);
  const mat = new THREE.MeshToonMaterial({color:color, gradientMap:GRAD});
  const step = dashLen + gapLen;
  const n = Math.floor(total/step);
  for(let i=0;i<=n;i++){
    const u = (i*step + dashLen/2)/total;
    if(u>1) break;
    const p = curve.getPointAt(u);
    const t = curve.getTangentAt(Math.min(0.999,u));
    const m = new THREE.Mesh(geo, mat);
    m.position.set(p.x, heightAt(p.x,p.z) + 0.10, p.z);
    m.rotation.y = Math.atan2(t.x, t.z);
    // lay it on the slope
    const h1 = heightAt(p.x - t.x*0.8, p.z - t.z*0.8);
    const h2 = heightAt(p.x + t.x*0.8, p.z + t.z*0.8);
    m.rotation.x = -Math.atan2(h2-h1, 1.6);
    scene.add(m);
  }
}

    text: "Traditionally identified as the room of the Last Supper, this was where the eleven remaining disciples were hiding \u2014 doors locked \u201cfor fear of the Jewish leaders\u201d \u2014 on the evening of the first Easter, when the risen Jesus is said to have appeared among them, showed his wounds, and breathed on them, saying \u201cReceive the Holy Spirit\u201d (John 20:19\u201323). Thomas, absent that night, famously doubted until Jesus returned a week later. The same upper room is traditionally linked to the outpouring described at Pentecost (Acts 2)."

    text: "A garden near Golgotha belonging to Joseph of Arimathea, a wealthy council member, who offered his own new rock-cut tomb for Jesus\u2019 hastily prepared burial before the Sabbath (John 19:38\u201342). On the first day of the week, women coming to anoint the body found the stone rolled away and the tomb empty. John\u2019s Gospel places the risen Jesus here too, appearing to Mary Magdalene, who at first mistook him for the gardener (John 20:1\u201318)."

    text: "The Second Temple, the center of Jewish worship in Jerusalem. Matthew records that at the moment of Jesus\u2019 death the temple curtain was \u201ctorn in two from top to bottom\u201d (Matthew 27:51). In the weeks after the resurrection, Acts describes the apostles continuing to gather and teach daily in the temple courts \u2014 including Peter and John healing a man at one of its gates (Acts 3:1\u201310) \u2014 even as tension with the temple authorities grew."

/* distance from the player to the EDGE of a place's footprint */
function edgeDistance(px,pz,p){
  const dx = Math.max(Math.abs(px-p.x) - p.hw, 0);
  const dz = Math.max(Math.abs(pz-p.z) - p.hh, 0);
  return Math.hypot(dx,dz);
}

/* ---------- HUD panel (image + info) for the five named places ---------- */
const hudEl      = document.getElementById('hud');
const hudImgEl   = document.getElementById('hudImg');
const hudTitleEl = document.getElementById('hudTitle');
const hudTextEl  = document.getElementById('hudText');
const hudCloseBtn= document.getElementById('hudClose');

let hudShownId    = null;  // which place's card is currently loaded/visible
let hudDismissedId= null;  // place whose card the user closed — stays closed
                            // until the player leaves its radius and re-enters

function updateHud(px,pz){
  // pick the nearest in-radius place that actually has HUD content
  let best = null, bestD = Infinity;
  PLACES.forEach(p=>{
    const info = HUD_INFO[p.id];
    if(!info) return;
    const d = edgeDistance(px,pz,p);
    if(d <= p.near && d < bestD){ bestD = d; best = p; }
  });

  if(!best){
    hudShownId = null;
    hudDismissedId = null;      // left every radius: clear the dismissal
    hudEl.classList.remove('open');
    return;
  }

  if(best.id === hudDismissedId){
    hudEl.classList.remove('open');   // user closed it; stay closed while still in range
    return;
  }

  if(best.id !== hudShownId){
    const info = HUD_INFO[best.id];
    hudTitleEl.textContent = info.title;
    hudTextEl.textContent  = info.text;
    if(info.img){ hudImgEl.src = info.img; hudImgEl.alt = info.title; hudImgEl.style.display = ''; }
    else { hudImgEl.removeAttribute('src'); hudImgEl.style.display = 'none'; }
    hudShownId = best.id;
  }
  hudEl.classList.add('open');
}

hudCloseBtn.addEventListener('click', ()=>{
  hudDismissedId = hudShownId;
  hudEl.classList.remove('open');
});

const proj = new THREE.Vector3();
function updateLabels(){
  const px = camera.position.x, pz = camera.position.z;
  updateHud(px,pz);
  PLACES.forEach(p=>{
    const d = edgeDistance(px,pz,p);
    const visible = d <= p.near;
    if(!visible){
      p.el.classList.remove('on');
      p.line.setAttribute('opacity','0');
      p.dot.setAttribute('opacity','0');
      return;
    }
    proj.copy(p.anchor).project(camera);
    if(proj.z > 1){                       // behind the camera
      p.el.classList.remove('on');
      p.line.setAttribute('opacity','0');
      p.dot.setAttribute('opacity','0');
      return;
    }
    const sx = (proj.x*0.5+0.5)*innerWidth;
    const sy = (-proj.y*0.5+0.5)*innerHeight;
    const lx = Math.min(innerWidth-110, Math.max(110, sx + 90));
    const ly = Math.min(innerHeight-90, Math.max(80, sy - 70));

    p.el.classList.add('on');
    p.el.style.left = lx + 'px';
    p.el.style.top  = ly + 'px';

    p.line.setAttribute('points', `${lx},${ly+3} ${(lx+sx)/2},${(ly+sy)/2} ${sx},${sy}`);
    p.line.setAttribute('opacity','0.9');
    p.dot.setAttribute('cx', sx); p.dot.setAttribute('cy', sy);
    p.dot.setAttribute('opacity','0.9');
  });
}

/* ============================================================
   FIRST PERSON CONTROLS
   ============================================================ */
const EYE = 1.7;
const START = { x:-16, z:-6, yaw:-Math.PI/2 };
const player = { x:START.x, z:START.z, yaw:START.yaw, pitch:0 };

const keys = {};
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code === 'KeyR'){ player.x=START.x; player.z=START.z; player.yaw=START.yaw; player.pitch=0;
                         feet = heightAt(START.x, START.z); }
  if(e.code === 'KeyM'){ birdsEye = !birdsEye; if(!birdsEye) player.pitch = 0; }
});
addEventListener('keyup', e=> keys[e.code] = false);

renderer.domElement.addEventListener('click', ()=> renderer.domElement.requestPointerLock());
addEventListener('mousemove', e=>{
  if(document.pointerLockElement !== renderer.domElement) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0018;
  player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch));
});

let bob = 0, birdsEye = false;
let feet = heightAt(START.x, START.z);
const clock = new THREE.Clock();

/* ============================================================
   TOUCH CONTROLS — on-screen joystick + look-drag for iPad
   and other touch devices, mirrored to the same `keys` map
   the keyboard controls use.
   ============================================================ */
if('ontouchstart' in window || navigator.maxTouchPoints > 0){
  document.body.classList.add('touch');
}

// left-thumb joystick: forward/back + strafe left/right
(function(){
  const joy = document.getElementById('tcJoy');
  const knob = document.getElementById('tcJoyKnob');
  if(!joy) return;
  let pid = null, cx = 0, cy = 0, maxR = 0;

  function apply(dx, dy){
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const nx = dx / maxR, ny = dy / maxR;
    keys['ArrowUp']   = ny < -0.28;
    keys['ArrowDown'] = ny >  0.28;
    keys['KeyA']      = nx < -0.28;
    keys['KeyD']      = nx >  0.28;
  }
  function clear(){
    knob.style.transform = 'translate(0px,0px)';
    keys['ArrowUp'] = keys['ArrowDown'] = keys['KeyA'] = keys['KeyD'] = false;
  }
  joy.addEventListener('pointerdown', e=>{
    if(pid !== null) return;
    pid = e.pointerId;
    const r = joy.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2; maxR = r.width/2 - 6;
    joy.setPointerCapture(pid);
    apply(0,0);
    e.preventDefault();
  });
  joy.addEventListener('pointermove', e=>{
    if(e.pointerId !== pid) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if(d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; }
    apply(dx, dy);
    e.preventDefault();
  });
  function release(e){
    if(e.pointerId !== pid) return;
    pid = null;
    clear();
  }
  joy.addEventListener('pointerup', release);
  joy.addEventListener('pointercancel', release);
})();

// right side of the screen: drag to look around (replaces mouse-look on touch)
(function(){
  const el = renderer.domElement;
  let pid = null, lastX = 0, lastY = 0;
  el.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' || pid !== null) return;
    pid = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    el.setPointerCapture(pid);
    hideTouchHint();
  });
  el.addEventListener('pointermove', e=>{
    if(e.pointerId !== pid) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    player.yaw   -= dx * 0.0032;
    player.pitch -= dy * 0.0028;
    player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch));
  });
  function release(e){ if(e.pointerId === pid) pid = null; }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
})();

function hideTouchHint(){
  const hint = document.getElementById('tcHint');
  if(hint) hint.classList.add('faded');
}
setTimeout(hideTouchHint, 4500);

// run toggle, map (bird's-eye) toggle, and reset — mirror the M / R / Shift keys
(function(){
  const runBtn = document.getElementById('tcRun');
  const mapBtn = document.getElementById('tcMap');
  const resetBtn = document.getElementById('tcReset');
  if(!runBtn) return;
  let running = false;

  runBtn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    running = !running;
    keys['ShiftLeft'] = running;
    runBtn.classList.toggle('active', running);
  });
  mapBtn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    birdsEye = !birdsEye;
    if(!birdsEye) player.pitch = 0;
    mapBtn.classList.toggle('active', birdsEye);
  });
  resetBtn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    player.x = START.x; player.z = START.z; player.yaw = START.yaw; player.pitch = 0;
    feet = heightAt(START.x, START.z);
  });
})();

function step(dt){
  const run = keys['ShiftLeft']||keys['ShiftRight'];
  const speed = (run ? 13 : 5.5) * dt;
  const turn  = 1.9 * dt;

  if(keys['ArrowLeft'])  player.yaw += turn;
  if(keys['ArrowRight']) player.yaw -= turn;

  let fwd = 0, strafe = 0;
  if(keys['ArrowUp']   || keys['KeyW']) fwd += 1;
  if(keys['ArrowDown'] || keys['KeyS']) fwd -= 1;
  if(keys['KeyA']) strafe -= 1;
  if(keys['KeyD']) strafe += 1;

  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = (-sin*fwd + cos*strafe) * speed;
  const dz = (-cos*fwd - sin*strafe) * speed;

  // move one axis at a time so you slide along walls instead of sticking;
  // if somehow already inside something, let the player walk back out
  const stuck = blockedAt(player.x, player.z, feet);
  if(dx && (stuck || !blockedAt(player.x + dx, player.z, feet))) player.x += dx;
  if(dz && (stuck || !blockedAt(player.x, player.z + dz, feet))) player.z += dz;

  // stay on the map
  const lim = GSIZE/2 - 12;
  player.x = Math.max(-lim, Math.min(lim, player.x));
  player.z = Math.max(-lim, Math.min(lim, player.z));

  const moving = (fwd!==0 || strafe!==0);
  bob += moving ? dt*(run?13:8) : 0;
  const bobY = moving ? Math.sin(bob)*0.055 : 0;

  // walk up stairs and onto terraces, and settle smoothly when stepping off
  const target = floorAt(player.x, player.z, feet);
  feet += (target - feet) * Math.min(1, dt * 14);
  if(Math.abs(target - feet) < 0.004) feet = target;

  const lift = birdsEye ? 118 : 0;
  camera.position.set(player.x, feet + EYE + bobY + lift, player.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(player.yaw);
  camera.rotateX(birdsEye ? -0.95 : player.pitch);

  document.getElementById('needle').setAttribute(
    'transform', `rotate(${(player.yaw*180/Math.PI).toFixed(1)} 50 50)`);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  requestAnimationFrame(loop);
  step(Math.min(0.1, clock.getDelta()));
  updateLabels();
  renderer.render(scene, camera);
}

/* handy for jumping straight to a spot from the console:
   J.go('THE TOMB')  ·  J.go('TEMPLE COMPLEX')  ·  J.player  */
window.J = {
  player, PLACES, camera, heightAt,
  go(name){
    const p = PLACES.find(q => q.name.replace(/\n/g,' ') === name || q.name.split('\n')[0] === name);
    if(!p) return 'no such place';
    player.x = p.x; player.z = p.z + p.hh + 1.0; player.yaw = 0; player.pitch = 0;
    feet = floorAt(player.x, player.z, 1e9);
    step(0); return 'at ' + name;
  }
};

step(0);
renderer.render(scene, camera);
document.getElementById('loading').style.display = 'none';
loop();
</script>
