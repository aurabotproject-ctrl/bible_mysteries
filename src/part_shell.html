<div id="app" class="hidden">
  <div id="topbar">
    <button class="tbtn" id="btnHome">← Cases</button>
    <div id="caseTitle"><span id="caseCode"></span><b id="caseName"></b></div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnDesk">🗂 Desk</button>
    <button class="tbtn" id="btnLocks">🔒 Locks <span class="pip" id="lockPip">0/2</span></button>
    <button class="tbtn" id="btnBoard">📌 Pinboard</button>
    <div class="tbtn chip" id="btnWrong">✖ Wrong <span class="pip" id="wrongPip">0/5</span></div>
    <button class="tbtn hidden" id="btnRiddle">🧩 Riddle</button>
    <button class="tbtn" id="btnBible">📖 Bible</button>
    <button class="tbtn" id="btnSheet">🖨 Sheet</button>
    <button class="tbtn" id="btnNotes">📝 Notes</button>
    <div class="lvl" id="lvlBar" title="Reading level — the same case, in plainer words">
      <span class="lvl-cap">Reading</span>
      <button class="lvl-b" data-lvl="easy">Easy</button>
      <button class="lvl-b" data-lvl="medium">Medium</button>
    </div>
    <div class="tint" id="tintBar" title="Colour for cards that have something to walk into">
      <span class="lvl-cap">Tint</span>
      <button class="tint-b" data-tint="red"    title="Red"    aria-label="Red"></button>
      <button class="tint-b" data-tint="blue"   title="Blue"   aria-label="Blue"></button>
      <button class="tint-b" data-tint="green"  title="Green"  aria-label="Green"></button>
      <button class="tint-b" data-tint="yellow" title="Yellow" aria-label="Yellow"></button>
    </div>
    <button class="tbtn" id="btnMenu">☰</button>
  </div>
  <div id="stage">
    <div id="desk"><svg id="strings" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="zoomTools">
      <button class="zbtn" id="btnZoomOut" title="Zoom out — more table to spread the cards on" aria-label="Zoom out">&minus;</button>
      <button class="zbtn wide" id="btnZoomFit" title="Show the whole table">100%</button>
      <button class="zbtn" id="btnZoomIn" title="Zoom in — close enough to read a card" aria-label="Zoom in">+</button>
    </div>
    <div id="stringTools">
      <button class="stbtn" id="btnString" title="Pin a string between two cards">🧵 Add string</button>
      <button class="stbtn" id="btnCut" title="Snip a string in half">✂ Cut string</button>
    </div>
    <div id="deskHint">Drag cards about · click one to read it · drag the bare wood to move the table</div>
    <div id="board" class="hidden"></div>
    <div id="notesPane" class="hidden">
      <h3>Case Notes</h3>
      <p>Anything you type is saved on this device. Use it to track times, names and contradictions.</p>
      <textarea id="notesArea" placeholder="Explanation:&#10;Evidence for:&#10;Evidence against:"></textarea>
      <button class="btn ghost" id="notesClose">Close</button>
    </div>
  </div>
</div>

<div id="shelf"></div>
<div id="buildTag" title="Which build of the app this is. If a new feature is missing, reload the page and check this changes.">build __BUILD__</div>
