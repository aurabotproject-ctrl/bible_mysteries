<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bible mystery-box investigations for Years 7-8: read the evidence, break the codes, eliminate every explanation the file will not support.">
<title>B.I.B. — The Bible Investigation Bureau</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{
  --wood-1:#5a3d28; --wood-2:#3f2a1b; --wood-3:#6b4a30;
  --paper:#efe3cb; --paper-2:#e4d5b7; --ink:#2e2419; --ink-soft:#5b4a35;
  --accent:#8c2f1f; --accent-2:#b4552f;
  --cork:#b98a52; --brass:#c9a227;
  --ui:#1b1410; --ui-2:#2a201a; --ui-line:#4a3a2c;
  --ok:#3f7d4e; --no:#9d3226;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --hand:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --ui-font:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--ui-font);color:#f0e6d6;
  background:var(--ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}

#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:linear-gradient(#2a201a,#1b1410);
  border-bottom:1px solid var(--ui-line);z-index:40;
}
#caseTitle{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#c8b491}
#caseTitle b{display:block;font-size:16px;letter-spacing:.04em;color:#f3e8d4;text-transform:none}
.spacer{flex:1}
.tbtn{
  background:#3a2d23;border:1px solid #55432f;color:#e9dcc4;
  padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.tbtn:hover{background:#4a392c;border-color:#7a5f42}
.tbtn.on{background:var(--accent);border-color:#c26a4a;color:#fff}
.tbtn .pip{background:var(--brass);color:#241a10;border-radius:999px;font-size:11px;padding:1px 6px;font-weight:800}

/* ---------- desk ---------- */
#stage{position:relative;flex:1;overflow:hidden}
#desk{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,220,160,.18), transparent 62%),
    repeating-linear-gradient(96deg, rgba(0,0,0,.05) 0 2px, transparent 2px 7px),
    linear-gradient(160deg,var(--wood-3),var(--wood-1) 45%,var(--wood-2));
  touch-action:none;
}
#desk::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 200px rgba(0,0,0,.55);
}

.item{
  position:absolute;width:196px;transform-origin:50% 50%;
  cursor:grab;user-select:none;touch-action:none;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));
  transition:filter .15s;
}
.item:active{cursor:grabbing}
.item.dragging{filter:drop-shadow(0 26px 30px rgba(0,0,0,.55));z-index:999!important}
.item.new{animation:drop .5s cubic-bezier(.2,1.3,.5,1) both}
@keyframes drop{from{transform:translate(-50%,-50%) scale(.5) rotate(0deg);opacity:0}}
.item .card{
  background:var(--paper);border-radius:3px;padding:12px 13px 32px;
  color:var(--ink);position:relative;overflow:hidden;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(139,105,60,.16), transparent 38%),
    radial-gradient(circle at 88% 92%, rgba(120,90,50,.14), transparent 40%);
  border:1px solid rgba(90,65,35,.35);
}
.item .card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 60%,rgba(90,64,30,.16));
}
.item .kind{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}
.item .ttl{font-family:var(--serif);font-size:14px;line-height:1.2;margin-top:4px;font-weight:700}
.item .prev{font-size:9.5px;line-height:1.45;color:var(--ink-soft);margin-top:6px;max-height:52px;overflow:hidden}
.item .thumb{margin-top:6px;background:#e9dcc0;border:1px solid rgba(90,65,35,.3);border-radius:2px}
.item .thumb svg,.item .thumb img{display:block;width:100%;height:auto}
.item .open{
  position:absolute;left:0;right:0;bottom:0;background:rgba(46,36,25,.9);color:#f0e2c6;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:5px 0;font-weight:700;
}
.item.pinnedOut{opacity:.35;filter:grayscale(.6) drop-shadow(0 6px 8px rgba(0,0,0,.4))}

.tape{
  position:absolute;width:66px;height:19px;background:rgba(240,230,200,.5);
  border-left:1px dashed rgba(255,255,255,.4);border-right:1px dashed rgba(255,255,255,.4);
  top:-9px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
}

#deskHint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(20,14,10,.75);border:1px solid var(--ui-line);border-radius:999px;
  padding:7px 16px;font-size:12px;color:#d8c8a8;pointer-events:none;
}

/* ---------- reader modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:9000;background:rgba(10,7,5,.82);
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(3px);animation:fade .18s both;
}
@keyframes fade{from{opacity:0}}
.sheet{
  background:var(--paper);color:var(--ink);border-radius:5px;
  max-width:720px;width:100%;max-height:92vh;overflow:auto;position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.7);
  background-image:
    radial-gradient(circle at 10% 4%, rgba(139,105,60,.13), transparent 35%),
    radial-gradient(circle at 92% 96%, rgba(120,90,50,.13), transparent 35%);
  animation:pop .22s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}
.sheet.wide{max-width:1000px}
.sheet .x{
  position:absolute;top:10px;right:10px;background:#2e2419;color:#f0e2c6;border:0;
  width:32px;height:32px;border-radius:50%;font-size:17px;line-height:1;z-index:5;
}
.sheet .body{padding:32px 38px 34px}
.doc-kind{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800}
.doc-title{font-family:var(--serif);font-size:27px;margin:6px 0 4px;line-height:1.15}
.doc-sub{font-size:12px;color:var(--ink-soft);font-style:italic;margin-bottom:16px}
.rule{height:1px;background:linear-gradient(90deg,rgba(90,65,35,.5),transparent);margin:14px 0}
.doc-body{font-family:var(--serif);font-size:15.5px;line-height:1.72}
.doc-body p{margin:0 0 13px}
.doc-body h4{font-family:var(--ui-font);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.doc-body ul{margin:0 0 13px;padding-left:20px}
.doc-body li{margin-bottom:5px}
.doc-body .sig{font-family:var(--hand);font-size:21px;color:#3a2c1c;margin-top:8px}
.doc-body .stamp{
  display:inline-block;border:2.5px solid rgba(140,47,31,.62);color:rgba(140,47,31,.8);
  padding:6px 14px;font-weight:800;letter-spacing:.18em;font-size:12px;
  transform:rotate(-6deg);border-radius:3px;margin:10px 0;font-family:var(--ui-font);
}
.ledger{width:100%;border-collapse:collapse;font-family:var(--ui-font);font-size:13.5px;margin:8px 0 14px}
.ledger td,.ledger th{border-bottom:1px solid rgba(90,65,35,.3);padding:7px 6px;text-align:left}
.ledger th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ledger td.n{text-align:right;font-variant-numeric:tabular-nums}
.ref{font-size:11.5px;color:var(--ink-soft);font-style:italic;border-top:1px dashed rgba(90,65,35,.4);padding-top:10px;margin-top:18px;font-family:var(--ui-font)}
.margin-note{font-family:var(--hand);color:#7a2318;font-size:16px;transform:rotate(-1.4deg);display:inline-block;margin:4px 0}
.plate{background:#e6d8ba;border:1px solid rgba(90,65,35,.35);border-radius:3px;padding:10px;margin:10px 0}
.plate svg,.plate img{display:block;width:100%;height:auto;border-radius:2px}
.plate .cap{font-size:11px;color:var(--ink-soft);font-style:italic;margin-top:8px;text-align:center;font-family:var(--ui-font)}
.zoomable{cursor:zoom-in}

/* ---------- lock panel ---------- */
.lockcard{background:var(--ui-2);border:1px solid var(--ui-line);border-radius:12px;padding:18px;margin-bottom:14px}
.lockcard.done{border-color:#3f7d4e;background:#1e2a1f}
.lockcard h3{margin:0 0 4px;font-size:16px;color:#f3e8d4}
.lockcard .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8946f;font-weight:700}
.lockcard.done .st{color:#7fc08f}
.lockcard p{font-size:13.5px;line-height:1.6;color:#cfbf9f;margin:9px 0}
.qs{margin:10px 0;padding-left:0;list-style:none}
.qs li{font-size:13px;color:#e0d2b4;padding:5px 0 5px 24px;position:relative;line-height:1.5}
.qs li::before{content:counter(qi);counter-increment:qi;position:absolute;left:0;top:4px;
  background:var(--brass);color:#241a10;width:17px;height:17px;border-radius:50%;
  font-size:10px;font-weight:800;display:grid;place-items:center}
.qs{counter-reset:qi}
.codebox{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.codebox input{
  background:#120d09;border:1px solid #5b4732;color:#f7e9c9;border-radius:8px;
  padding:11px 14px;font-size:19px;letter-spacing:.4em;width:180px;text-align:center;
  font-family:ui-monospace,monospace;text-transform:uppercase;
}
.codebox input:focus{outline:2px solid var(--brass);outline-offset:1px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700}
.btn:hover{background:#a53a26}
.btn.ghost{background:transparent;border:1px solid var(--ui-line);color:#cbb894}
.btn.ghost:hover{border-color:#7a5f42;color:#f0e2c6}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:13px;margin-top:9px;min-height:18px}
.msg.bad{color:#e58b78}
.msg.good{color:#8fd3a3}
.hintwrap{margin-top:12px}
.hint{background:#241c15;border-left:3px solid var(--brass);padding:9px 12px;font-size:13px;color:#d9c9a7;margin-top:8px;border-radius:0 6px 6px 0;line-height:1.55}

/* ---------- pinboard ---------- */
#board{
  position:absolute;inset:0;z-index:500;overflow:auto;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,230,180,.16), transparent 60%),
    repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,.045) 0 2px, transparent 2px 5px),
    linear-gradient(160deg,#c69a63,#a9773f 60%,#8d5f2f);
}
#board .inner{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
.boardhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.boardhead h2{font-family:var(--serif);color:#2e2113;margin:0;font-size:23px}
.boardhead p{color:#3f2e1a;font-size:13.5px;margin:5px 0 0;max-width:640px;line-height:1.55}
.theories{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.theory{
  background:var(--paper);border-radius:3px;padding:14px 14px 12px;color:var(--ink);position:relative;
  box-shadow:0 8px 18px rgba(0,0,0,.35);border:1px solid rgba(90,65,35,.3);
}
.theory .pin{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ff8a6b,#a32d15);
  box-shadow:0 3px 5px rgba(0,0,0,.45);
}
.theory h4{font-family:var(--serif);font-size:16px;margin:6px 0 4px;line-height:1.25}
.theory .claim{font-size:12.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:10px}
.slot{
  border:2px dashed rgba(90,65,35,.5);border-radius:6px;min-height:62px;
  display:grid;place-items:center;text-align:center;padding:9px;
  font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.22);transition:.15s;
}
.slot.hot{border-color:var(--accent);background:rgba(180,85,47,.16)}
.slot.filled{border-style:solid;background:rgba(255,255,255,.5);font-size:12.5px;color:var(--ink);font-weight:600}
.slot.right{border-color:var(--ok);background:rgba(63,125,78,.16)}
.slot.wrong{border-color:var(--no);background:rgba(157,50,38,.14)}
.verdict{font-size:12px;margin-top:9px;line-height:1.55;font-family:var(--serif)}
.verdict.right{color:#2f6b3d}
.verdict.wrong{color:#8c2f1f}
.rail{
  background:rgba(30,20,12,.86);border-radius:10px;padding:12px;margin-top:20px;
}
.rail h5{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c9b189}
.rail .sub{font-size:12px;color:#a08d6d;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--paper-2);color:var(--ink);border:1px solid rgba(90,65,35,.4);
  border-radius:6px;padding:8px 11px;font-size:12.5px;cursor:grab;user-select:none;
  max-width:230px;line-height:1.3;
}
.chip:hover{background:#f3e8ce}
.chip.sel{outline:3px solid var(--brass);background:#fff6e0}
.chip.used{opacity:.32;cursor:default}
.boardbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}

/* ---------- accusation / debrief ---------- */
.choices{display:grid;gap:10px;margin:16px 0}
.choice{
  text-align:left;background:#efe3cb;border:2px solid rgba(90,65,35,.3);border-radius:8px;
  padding:13px 15px;color:var(--ink);font-size:14.5px;line-height:1.45;font-family:var(--serif);
}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:#fff4de;box-shadow:0 0 0 3px rgba(140,47,31,.16)}
textarea{
  width:100%;min-height:120px;background:#f6ecd6;border:1px solid rgba(90,65,35,.4);
  border-radius:8px;padding:12px;font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.6;resize:vertical;
}
.seal-final{width:78px;height:78px;margin:0 auto 12px;display:block}

/* ---------- case-file intro ---------- */
#intro{
  position:fixed;inset:0;z-index:9500;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 42%, #4a3423, #1a120c 72%);
  text-align:center;padding:22px;
}
#intro .kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#a58b62}
#intro h1{font-family:var(--serif);font-size:clamp(28px,5.5vw,50px);margin:8px 0 4px;color:#f5e9d2}
#intro .sub{color:#bda882;font-size:15px;margin-bottom:26px}
#intro .tap{margin-top:22px;font-size:13px;color:#8f7a58;letter-spacing:.16em;text-transform:uppercase}
#intro.leaving{animation:goaway .7s ease-in forwards}
@keyframes goaway{to{opacity:0;transform:scale(1.14);visibility:hidden}}

.folder{
  width:min(460px,88vw);aspect-ratio:4/3;margin:0 auto;position:relative;
  perspective:1600px;cursor:pointer;
}
.folder .stack{position:absolute;inset:5% 4% 3% 6%;border-radius:2px 6px 6px 2px;
  background:#efe4cb;box-shadow:0 20px 34px rgba(0,0,0,.6);overflow:hidden}
.folder .stack i{position:absolute;left:8%;right:6%;height:2px;background:rgba(90,65,35,.28);display:block}
.folder .stack i:nth-child(1){top:22%} .folder .stack i:nth-child(2){top:32%;right:22%}
.folder .stack i:nth-child(3){top:42%} .folder .stack i:nth-child(4){top:52%;right:30%}
.folder .stack i:nth-child(5){top:62%} .folder .stack i:nth-child(6){top:72%;right:16%}
.folder .stack::before{content:"";position:absolute;left:8%;top:8%;width:34%;height:8%;background:rgba(140,47,31,.5);border-radius:2px}
.folder .back{position:absolute;inset:0;border-radius:3px 10px 10px 3px;
  background:linear-gradient(#c9a86e,#a8854f);box-shadow:inset 0 0 40px rgba(90,60,20,.4)}
.folder .cover{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.05s cubic-bezier(.55,.02,.25,1);
  background:linear-gradient(160deg,#e0bd83,#c49a5f 55%,#ab8149);
  border-radius:3px 10px 10px 3px;
  box-shadow:0 18px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,240,205,.35);
}
.folder .cover::before{ /* the tab */
  content:"";position:absolute;top:-22px;right:14%;width:31%;height:24px;
  background:linear-gradient(#e0bd83,#cda36a);border-radius:6px 6px 0 0;
}
.folder{transition:transform .9s cubic-bezier(.55,.02,.25,1)}
.folder.open{transform:translateX(20%)}
.folder.open .cover{transform:rotateY(-152deg)}
.folder.open .f-label,.folder.open .f-stamp{opacity:0;transition:opacity .3s}
.f-label{
  position:absolute;left:9%;top:20%;width:56%;padding:12px 14px;text-align:left;
  background:#f4ebd6;border:1px solid rgba(90,65,35,.45);border-radius:2px;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.f-label .l1{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8a6f45}
.f-label .l2{font-family:var(--serif);font-size:19px;font-weight:700;color:#2e2419;line-height:1.15;margin-top:4px}
.f-label .l3{font-size:10.5px;color:#6b5636;font-style:italic;margin-top:3px}
.f-stamp{
  position:absolute;right:7%;bottom:15%;border:3px solid rgba(140,47,31,.66);color:rgba(140,47,31,.82);
  padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.16em;border-radius:3px;
  transform:rotate(-11deg);font-family:var(--ui-font);background:rgba(255,245,225,.28);
}
.f-string{position:absolute;left:0;right:0;top:52%;height:3px;background:rgba(90,60,25,.55);
  box-shadow:0 1px 0 rgba(255,235,200,.35)}
.f-button{position:absolute;left:50%;top:52%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#e6cfa0,#8a6a3c 60%,#4d3a1f);box-shadow:0 3px 6px rgba(0,0,0,.5)}
.folder.open .f-string,.folder.open .f-button{opacity:0;transition:opacity .35s}
.folder:hover .cover{transform:rotateY(-7deg)}
.folder.open:hover .cover{transform:rotateY(-152deg)}

/* ---------- notes ---------- */
#notesPane{
  position:absolute;top:0;right:0;bottom:0;width:min(400px,88vw);z-index:600;
  background:#241a12;border-left:1px solid var(--ui-line);padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:-16px 0 40px rgba(0,0,0,.5);
}
#notesPane h3{margin:0;font-size:14px;color:#f0e2c6}
#notesPane p{margin:0;font-size:12px;color:#a08d6d;line-height:1.5}
#notesPane textarea{flex:1;background:#f6ecd6}

.small{font-size:12px;color:#a08d6d;line-height:1.55}
kbd{background:#3a2d23;border:1px solid #55432f;border-radius:4px;padding:1px 6px;font-size:11px}

@media(max-width:760px){
  .item{width:150px}
  .sheet .body{padding:24px 20px 26px}
  .doc-title{font-size:22px}
  #caseTitle{display:none}
}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  #topbar,#desk,#board,.x,.btn{display:none!important}
  .overlay{position:static;background:#fff;padding:0;display:block}
  .sheet{max-width:none;box-shadow:none;background:#fff}
}
</style>
<style>
/* ---------- topbar case name ---------- */
#caseCode{display:block}
#caseName{display:block;font-size:16px;letter-spacing:.04em;color:#f3e8d4;text-transform:none;font-family:var(--serif)}

/* ---------- the case board (wanted-poster wall) ---------- */
#shelf{
  position:fixed;inset:0;z-index:150;overflow:auto;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,206,140,.20), transparent 55%),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.22) 0 2px, rgba(255,255,255,.03) 2px 5px,
      rgba(0,0,0,.05) 5px 148px, rgba(0,0,0,.30) 148px 154px),
    repeating-linear-gradient(88deg, rgba(0,0,0,.05) 0 3px, transparent 3px 11px),
    linear-gradient(170deg,#5b3f27,#3d2917 55%,#241708);
}
#shelf::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,.65)}
.shelfwrap{max-width:1240px;margin:0 auto;padding:34px 24px 70px;position:relative;z-index:1}

.boardsign{
  background:linear-gradient(#7a5732,#5e3f22);border:1px solid #3a2612;border-radius:4px;
  padding:18px 26px 20px;text-align:center;position:relative;
  box-shadow:0 14px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,225,180,.18);
  max-width:720px;margin:0 auto 34px;
}
.boardsign::before,.boardsign::after{
  content:"";position:absolute;top:9px;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#e8d9b0,#7a6647 60%,#3b3121);
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}
.boardsign::before{left:12px} .boardsign::after{right:12px}
.boardsign .kicker{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#e0c9a0}
.boardsign h1{font-family:var(--serif);font-size:clamp(22px,3.8vw,34px);color:#fdf1d8;margin:6px 0 2px;font-weight:700;
  text-shadow:0 2px 0 rgba(0,0,0,.45)}
.boardsign .kicker{font-weight:700}
.boardsign .dept{
  font-family:var(--serif);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#d8bd93;margin:0 0 10px;
}
.boardsign p{color:#e6d2ae;font-size:13.5px;line-height:1.55;margin:0 auto;max-width:560px}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:34px 26px;margin-top:6px}
.poster{
  position:relative;padding:20px 18px 18px;border-radius:2px;color:var(--ink);
  transform:rotate(var(--r,0deg));transition:transform .2s, box-shadow .2s;
  background:
    radial-gradient(circle at 14% 6%, rgba(150,112,60,.16), transparent 42%),
    radial-gradient(circle at 86% 94%, rgba(130,96,52,.15), transparent 44%),
    linear-gradient(#f6ecd4,#e6d6b2);
  box-shadow:0 16px 30px rgba(0,0,0,.5);
  border:1px solid rgba(90,65,35,.35);
  display:flex;flex-direction:column;
}
.poster:hover{transform:rotate(0deg) translateY(-5px);box-shadow:0 24px 44px rgba(0,0,0,.6)}
.poster::before{  /* nail head */
  content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#f2e3bd,#8a7452 55%,#40352180);
  box-shadow:0 3px 5px rgba(0,0,0,.55);
}
.poster .p-soc{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);text-align:center}
.poster .p-code{
  font-family:var(--serif);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--fc);font-weight:700;text-align:center;margin-top:3px;
}
.p-hr{height:2px;background:var(--ink);opacity:.55;margin:8px 0 10px}
.p-hr.thin{height:1px;opacity:.3;margin:9px 0}
.poster .art{
  border:1px solid rgba(90,65,35,.45);background:#e4d5b4;overflow:hidden;aspect-ratio:3/2;
  box-shadow:inset 0 0 22px rgba(90,64,30,.28);
}
.poster .art svg,.poster .art img{display:block;width:100%;height:100%;object-fit:cover}
.poster .p-title{font-family:var(--serif);font-size:26px;line-height:1.06;font-weight:700;text-align:center;margin:11px 0 3px}
.poster .p-where{font-size:11px;color:var(--ink-soft);font-style:italic;text-align:center}
.poster .p-teaser{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:10px 0 0;flex:1}
.p-stamp{
  align-self:center;margin:12px 0 2px;border:2.5px solid;border-radius:3px;
  padding:4px 12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;
  transform:rotate(-4deg);opacity:.82;
}
.p-stamp.new{color:#7a6a4d;border-color:#7a6a4d}
.p-stamp.wip{color:#8a5518;border-color:#8a5518}
.p-stamp.done{color:#2f6b3d;border-color:#2f6b3d}
.p-sub{text-align:center;font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:5px}
.p-acts{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.p-open{
  flex:1;background:var(--fc);color:#fff;border:0;border-radius:5px;padding:11px 12px;
  font-size:13.5px;font-weight:700;font-family:var(--ui-font);
}
.p-open:hover{filter:brightness(1.12)}
.p-restart{
  background:transparent;border:1px solid rgba(90,65,35,.5);color:var(--ink-soft);
  border-radius:5px;padding:11px 12px;font-size:12.5px;font-weight:600;font-family:var(--ui-font);
}
.p-restart:hover{border-color:var(--no);color:var(--no)}
.poster.soon{opacity:.42;filter:saturate(.45)}
.poster.soon:hover{transform:rotate(var(--r,0deg));box-shadow:0 16px 30px rgba(0,0,0,.5)}
.boardfoot{margin-top:38px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.boardfoot .small{color:#c4a97f}

/* ---------- the crossword / riddle sheet ---------- */
.cwwrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.cwgrid{
  display:grid;gap:0;background:#4a3520;padding:2px;border-radius:2px;
  grid-template-columns:repeat(var(--n),minmax(0,1fr));
  width:min(100%,calc(var(--n) * 44px));flex:0 0 auto;
}
.cwc{position:relative;aspect-ratio:1/1;background:#efe4cb;border:1px solid rgba(90,65,35,.35)}
.cwc.block{background:transparent;border-color:transparent}
.cwc.mark{background:#f6e2b4;box-shadow:inset 0 0 0 2px var(--brass)}
.cwc input{
  width:100%;height:100%;border:0;background:transparent;text-align:center;
  font-family:var(--serif);font-size:clamp(14px,3.4vw,20px);font-weight:700;color:var(--ink);
  text-transform:uppercase;padding:0;outline:none;
}
.cwc input:focus{background:rgba(201,162,39,.22)}
.cwc.bad input{color:#9d3226}
.cwc .cn{position:absolute;top:1px;left:2px;font-size:9px;line-height:1;color:var(--ink-soft);font-family:var(--ui-font);font-weight:700}
.cwc .cm{position:absolute;bottom:1px;right:2px;font-size:9px;line-height:1;color:#8a6a1e;font-family:var(--ui-font);font-weight:800}
.cwclues{flex:1;min-width:260px;display:flex;gap:26px;flex-wrap:wrap}
.cwcol{flex:1;min-width:230px}
.cwcol h5{font-family:var(--ui-font);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:800}
.cwcol ol{list-style:none;margin:0;padding:0}
.cwcol li{font-family:var(--serif);font-size:13.5px;line-height:1.45;margin-bottom:8px;color:var(--ink);cursor:pointer}
.cwcol li b{color:var(--accent);font-family:var(--ui-font);font-size:11.5px;margin-right:5px}
.cwcol li.got{opacity:.45;text-decoration:line-through}
.cwstrip{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
.cwbox{
  width:38px;height:44px;border:2px solid rgba(90,65,35,.5);border-radius:3px;background:rgba(255,255,255,.5);
  display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:700;position:relative;
}
.cwbox span{position:absolute;top:-9px;left:-6px;background:var(--brass);color:#241a10;border-radius:50%;
  width:16px;height:16px;font-size:9.5px;font-weight:800;display:grid;place-items:center;font-family:var(--ui-font)}
.cwbox.full{border-color:var(--brass);background:#fff6e0}

/* ---------- the Bible reader ---------- */
.bibsheet{max-width:1180px;width:100%}
.bibhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.bibhead .doc-title{margin:2px 0 0}
.bibtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bibsearch{
  background:rgba(255,255,255,.6);border:1px solid rgba(90,65,35,.45);border-radius:6px;
  padding:9px 12px;font-family:var(--ui-font);font-size:13.5px;color:var(--ink);min-width:200px;outline:none;
}
.bibsearch:focus{border-color:var(--accent);background:#fff}
.bibtoggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none}
.bibtoggle input{width:15px;height:15px;accent-color:var(--accent)}
.bibwrap{display:flex;gap:20px;align-items:flex-start;margin-top:8px}
.bibrail{flex:0 0 190px;max-height:62vh;overflow:auto;padding-right:6px}
.bibrail h6{font-family:var(--ui-font);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:10px 0 6px;font-weight:800}
.bibrail button{
  display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;
  padding:4px 7px;font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.25;
}
.bibrail button:hover{background:rgba(90,65,35,.12)}
.bibrail button.on{background:var(--accent);color:#fff;font-weight:700}
.bibmain{flex:1;min-width:0;max-height:62vh;overflow:auto;padding-right:4px}
.bibchaps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.bibchaps button{
  min-width:31px;background:rgba(255,255,255,.5);border:1px solid rgba(90,65,35,.35);border-radius:4px;
  padding:4px 6px;font-family:var(--ui-font);font-size:12.5px;color:var(--ink);
}
.bibchaps button:hover{border-color:var(--accent)}
.bibchaps button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.bibref{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 10px}
.bibbody{font-family:var(--serif);font-size:16.5px;line-height:1.78;color:var(--ink)}
.bv{display:block;padding:2px 6px;border-radius:4px;margin:0 -6px}
.bv sup{color:var(--accent);font-weight:800;font-size:10.5px;font-family:var(--ui-font);margin-right:5px;vertical-align:super}
.bv.hit{background:rgba(201,162,39,.28);box-shadow:inset 3px 0 0 var(--brass)}
.bibfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px dashed rgba(90,65,35,.4)}
.bibnote{font-size:11.5px;color:var(--ink-soft);font-style:italic;flex:1;min-width:220px}
.bibresults{max-height:62vh;overflow:auto}
.bibresult{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(90,65,35,.18);
  padding:9px 6px;font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.5}
.bibresult:hover{background:rgba(90,65,35,.1)}
.bibresult b{color:var(--accent);font-family:var(--ui-font);font-size:11.5px;display:block;margin-bottom:2px}
.bibresult mark{background:rgba(201,162,39,.4);color:inherit;padding:0 1px}
a.bref{
  color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer;font-weight:600;
}
a.bref:hover{background:rgba(201,162,39,.22);border-bottom-style:solid}
.bibloading{padding:40px 10px;text-align:center;color:var(--ink-soft);font-style:italic}
@media(max-width:760px){
  .bibwrap{flex-direction:column}
  .bibrail{flex:1 1 auto;width:100%;max-height:150px;display:flex;flex-wrap:wrap;gap:4px}
  .bibrail h6{width:100%;margin:6px 0 2px}
  .bibrail button{width:auto;font-size:12.5px;padding:4px 8px;border:1px solid rgba(90,65,35,.3)}
  .bibmain{max-height:none}
}

/* ---------- printable answer sheet ---------- */
.sheetdoc{color:var(--ink)}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.sd-names{display:flex;gap:12px;flex-wrap:wrap}
.fld{margin:0 0 14px}
.fld.inline{min-width:190px;margin:0}
.fld label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:5px}
.wl{
  border:1px solid rgba(90,65,35,.45);border-radius:4px;background:rgba(255,255,255,.55);
  padding:7px 9px;min-height:30px;font-family:var(--serif);font-size:14px;line-height:1.55;outline:none;
}
.wl:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(140,47,31,.12)}
.sd-h{font-family:var(--ui-font);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:22px 0 6px;font-weight:800}
.sd-table{width:100%;border-collapse:collapse;margin:4px 0 6px}
.sd-table th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:left;padding:5px 6px;border-bottom:1px solid rgba(90,65,35,.4)}
.sd-table td{padding:6px;vertical-align:top;border-bottom:1px solid rgba(90,65,35,.18)}
.sd-table td.th{font-family:var(--serif);font-size:13.5px;font-weight:600;line-height:1.3}
.sd-foot{margin-top:20px;font-size:10.5px;color:var(--ink-soft);font-style:italic;border-top:1px dashed rgba(90,65,35,.4);padding-top:8px}

/* ---------- the paper edition ---------- */
.ppdoc{color:var(--ink);font-family:var(--serif)}
.pp-page,.pp-sec{padding:6px 0 26px;border-bottom:2px dashed rgba(90,65,35,.35);margin-bottom:22px}
.pp-soc{font-family:var(--ui-font);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);text-align:center}
.pp-code{font-family:var(--ui-font);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800;text-align:center;margin-top:4px}
.pp-cover h1{font-family:var(--serif);font-size:38px;text-align:center;margin:6px 0 2px;line-height:1.08}
.pp-where{text-align:center;font-style:italic;color:var(--ink-soft);font-size:13px}
.pp-art{max-width:440px;margin:16px auto;border:1px solid rgba(90,65,35,.45)}
.pp-art svg,.pp-art img{display:block;width:100%;height:auto}
.pp-teaser{font-size:14px;line-height:1.6;max-width:620px;margin:12px auto;text-align:center;color:var(--ink-soft)}
.pp-stamp{display:block;width:fit-content;margin:14px auto;border:2.5px solid rgba(140,47,31,.6);color:rgba(140,47,31,.85);
  padding:6px 14px;font-family:var(--ui-font);font-size:11px;font-weight:800;letter-spacing:.16em;transform:rotate(-2deg);border-radius:3px}
.pp-h{font-family:var(--ui-font);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:0 0 8px}
.pp-lead{font-size:14px;line-height:1.6;color:var(--ink-soft);margin:0 0 14px}
.pp-step{display:flex;gap:12px;margin-bottom:14px;break-inside:avoid}
.pp-step > b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--ui-font);font-size:14px}
.pp-step h5{font-family:var(--serif);font-size:17px;margin:2px 0 5px;font-weight:700}
.pp-step p,.pp-step li{font-size:13.5px;line-height:1.6;margin:0 0 7px}
.pp-tip{font-style:italic;color:var(--ink-soft)}
.pp-qs{margin:8px 0;padding-left:20px}
.pp-qs li{margin-bottom:9px;font-size:13.5px}
.pp-blank{display:inline-block;width:60px;border-bottom:1px solid rgba(90,65,35,.6);margin-left:8px}
.pp-note{border:1px solid rgba(90,65,35,.4);border-left:4px solid var(--accent);padding:10px 13px;font-size:13px;margin-top:14px}
.pp-cards{display:block}
.pp-card{border:1.5px dashed rgba(90,65,35,.65);border-radius:3px;padding:16px 18px 8px;margin-bottom:18px;break-inside:avoid;position:relative}
.pp-band{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-family:var(--ui-font);
  font-size:9px;letter-spacing:.16em;padding:3px 9px;font-weight:800}
.pp-ct{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.15;margin:3px 0 2px}
.pp-cut{font-family:var(--ui-font);font-size:9px;letter-spacing:.14em;color:var(--ink-soft);text-align:right;margin-top:6px}
.pp-card .plate{max-width:100%;margin:12px 0}
.pp-keep{font:600 10px/1.4 var(--ui);letter-spacing:.1em;text-transform:uppercase;
  color:#8a7551;margin:6px 0 0}
.pp-labels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pp-env{border:1.5px dashed rgba(90,65,35,.65);padding:14px;text-align:center;break-inside:avoid}
.pp-envk{font-family:var(--ui-font);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.pp-envc{font-family:ui-monospace,monospace;font-size:30px;font-weight:700;letter-spacing:.2em;margin:6px 0 4px}
.pp-envn{font-family:var(--ui-font);font-size:9px;color:var(--ink-soft);letter-spacing:.1em}
.pp-slips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pp-slip{border:1.5px dashed rgba(90,65,35,.65);padding:10px 12px;font-size:13px;font-weight:700;break-inside:avoid}
.pp-slip span{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:3px}
.pp-seal{text-align:center;padding-top:40px}
.pp-sealbig{font-family:ui-monospace,monospace;font-size:52px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.pp-sealsub{font-family:var(--serif);font-size:19px;margin:4px 0 14px}
.pp-board{display:grid;grid-template-columns:1fr;gap:12px}
.pp-theory{border:1px solid rgba(90,65,35,.5);padding:12px 14px;break-inside:avoid}
.pp-tt{font-family:var(--serif);font-size:17px;font-weight:700}
.pp-tc{font-size:12.5px;color:var(--ink-soft);margin:3px 0 9px;line-height:1.5}
.pp-slot{border:2px dashed rgba(90,65,35,.5);min-height:46px;display:grid;place-items:center;
  font-family:var(--ui-font);font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase}
.pp-tags{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pp-tag{border:1.5px dashed rgba(90,65,35,.6);padding:9px 11px;font-size:13px;font-weight:600;text-align:center;break-inside:avoid}
.pp-choices{display:grid;gap:8px;margin:10px 0}
.pp-choice{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;break-inside:avoid}
.pp-box{flex:0 0 15px;height:15px;border:1.5px solid var(--ink);margin-top:3px}
.pp-rule{border-bottom:1px solid rgba(90,65,35,.55);height:26px}
.pp-sign2{display:flex;gap:24px;margin-top:20px}
.pp-sign2>div{flex:1}
.pp-sign2 span{font-family:var(--ui-font);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.pp-key{border:2px solid var(--no);padding:16px}
.pp-key p{font-size:13px;line-height:1.6;margin:0 0 9px}
.pp-label{margin-top:24px}
.pp-labelin{border:2px solid rgba(90,65,35,.7);padding:16px 18px;text-align:center}
.pp-labeltitle{font-family:var(--serif);font-size:26px;font-weight:700;margin:4px 0 12px}
.pp-labelline{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.pp-fill{display:grid;gap:14px;max-width:420px;margin:20px auto}
.pp-fill>div span{font-family:var(--ui-font);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.pp-index{width:100%;border-collapse:collapse;font-family:var(--ui-font);font-size:11.5px}
.pp-index th{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:5px 6px;border-bottom:1.5px solid rgba(90,65,35,.5)}
.pp-index td{border-bottom:1px solid rgba(90,65,35,.28);padding:6px;height:22px}
.pp-index td.tick{width:22px;border:1px solid rgba(90,65,35,.45)}
.pp-spines{display:grid;gap:14px}
.pp-spine{border:1.5px dashed rgba(90,65,35,.6);padding:10px 14px;text-align:center;break-inside:avoid}
.pp-spine b{font-family:var(--ui-font);font-size:12px;letter-spacing:.28em}
.pp-spine span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:3px}

/* the crossword on paper */
.ppcw{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.ppgrid{display:grid;grid-template-columns:repeat(var(--n),26px);gap:0;background:#4a3520;padding:2px;flex:0 0 auto}
.ppc{width:26px;height:26px;background:#fff;border:1px solid rgba(90,65,35,.5);position:relative}
.ppc.bl{background:#4a3520;border-color:#4a3520}
.ppc.mk{background:#f6e2b4}
.ppc .n{position:absolute;top:0;left:1px;font-size:8px;font-family:var(--ui-font);font-weight:700}
.ppc .m{position:absolute;bottom:0;right:1px;font-size:8px;font-family:var(--ui-font);font-weight:800;color:#8a6a1e}
.ppclues{flex:1;min-width:230px;display:flex;gap:18px;flex-wrap:wrap}
.ppclues h6{font-family:var(--ui-font);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 5px}
.ppclues ol{list-style:none;margin:0;padding:0}

/* ---------- print ---------- */
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #app,#shelf,#intro{display:none!important}
  .overlay:not(.printme){display:none!important}
  .overlay.printme{position:static;inset:auto;background:#fff;padding:0;display:block;backdrop-filter:none;animation:none}
  .overlay.printme .sheet{max-width:none;width:auto;max-height:none;overflow:visible;box-shadow:none;background:#fff;animation:none}
  .overlay.printme .sheet .body{padding:0}
  .x,.noprint,.btn{display:none!important}
  .wl{background:#fff;border:1px solid #9a8c74;min-height:34px}
  .sd-table td,.sd-table th{border-color:#b3a68e}
  .sd-h,.fld label,.sd-table th{color:#000}
  /* squeeze it onto one A4 page */
  .doc-title{font-size:20px}
  .sd-h{margin:12px 0 4px}
  .fld{margin-bottom:9px}
  .sd-table td{padding:4px 6px}
  .sd-table{margin-bottom:2px}
  .wl{min-height:30px!important}
  [data-f^="ev"],[data-f^="wh"]{min-height:42px!important}
  [data-f="why"]{min-height:62px!important}
  [data-f="hard"]{min-height:48px!important}
  [data-f="concl"]{min-height:34px!important}
  .sd-foot{margin-top:12px}
  /* the paper edition */
  @page{size:A4;margin:11mm}
  .ppdoc{color:#000}
  .pp-page,.pp-sec{break-after:page;page-break-after:always;border-bottom:0;margin-bottom:0;padding-bottom:0}
  .pp-cards{break-after:page;page-break-after:always}
  .pp-card,.pp-theory,.pp-env,.pp-slip,.pp-tag,.pp-step,.pp-spine{break-inside:avoid;page-break-inside:avoid}
  .pp-card{border-color:#8a7a5e}
  .pp-band{background:#7a2f1f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp-step > b{background:#7a2f1f!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ppc.bl,.ppgrid{background:#3a2a18!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ppc.mk,.pp-kb span,.cwbox span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp-art{max-width:520px}
  /* Plates carry typeset labels that have to be readable on paper, so they run
     the full width of the card rather than sitting at half size. The height cap
     keeps a card with a long body from overflowing its page. */
  .pp-card{padding:14px 12px 8px}
  .pp-card .plate{max-width:100%;margin:12px 0}
  .pp-card .plate svg,.pp-card .plate img{width:100%;height:auto}
  .pp-card .cap{font-size:9px}
  /* A plate document is a sheet, not a cut-out card: it gets its own page so the
     artwork can run full width, and it is allowed to flow onto a second page. */
  .pp-card.sheet{break-before:page;page-break-before:always;break-after:page;page-break-after:always;
    break-inside:auto;page-break-inside:auto;border:0;padding:0;margin:0}
  .pp-card.sheet .plate{break-inside:avoid;page-break-inside:avoid;margin:14px 0 12px}
  /* Width, not height, is the lever: these plates are all 3:2, so the width
     sets the height. A sheet also sets its text a little tighter than a card,
     which is what buys the plate its size and keeps the sheet to one page. */
  .pp-card.sheet .plate{margin-left:auto;margin-right:auto}
  .pp-card.sheet .plate.wideplate{max-width:168mm}
  .pp-card.sheet .plate.squareplate{max-width:128mm}
  .pp-card.sheet .plate.tallplate{max-width:96mm}
  .pp-card.sheet .doc-body{font-size:14.5px;line-height:1.55}
  .pp-card.sheet .doc-body p,.pp-card.sheet .doc-body ul{margin-bottom:9px}
  .pp-card.sheet .ledger{margin:6px 0 10px}
  .pp-card.sheet .ledger td,.pp-card.sheet .ledger th{padding:5px 6px}
  .pp-card.sheet .doc-body h4{margin-top:14px}
  .pp-card.sheet .ref{margin-top:10px;padding-top:6px;break-before:avoid;page-break-before:avoid}
  .pp-card.sheet{position:relative}
  .pp-cert{break-after:page;page-break-after:always}
  .pp-cert .cert{min-height:255mm}
  .cert-in{padding:40px 34px}
}

const CASE_STUBS = [{"id": "jm33", "code": "CASE JM-33", "title": "The Empty Tomb", "period": "Jerusalem · c. AD 33", "colour": "#8c2f1f", "poster": "poster_jm33", "teaser": "A sealed tomb, four Roman guards on watch, and no body in the morning. Five explanations have been offered. Only one survives the file.", "nlocks": 2, "ntheories": 5}, {"id": "jm47", "code": "CASE JM-47", "title": "The Leak", "period": "Aram and Israel · c. 850 BC", "colour": "#2f5c7d", "poster": "poster_jm47", "teaser": "Five ambushes laid in secret. Five times the enemy simply did not come. The king of Aram is certain one of his own officers is talking — and he is about to be told something far stranger.", "nlocks": 2, "ntheories": 5}, {"id": "jm19", "code": "CASE JM-19", "title": "The Broken Riddle", "period": "Timnah, Philistia · c. 1100 BC", "colour": "#8a6a24", "poster": "poster_jm19", "teaser": "A riddle only one man on earth could answer — and thirty men answered it, perfectly, an hour before the deadline. Nobody saw. Nobody was told. Somebody is lying.", "nlocks": 2, "ntheories": 5}, {"id": "jm08", "code": "CASE JM-08", "title": "The Stolen Plunder", "period": "Jericho and Ai · c. 1400 BC", "colour": "#6b4a2a", "poster": "poster_jm08", "teaser": "Jericho fell in a week. Days later, a village stopped the same army dead and thirty-six men died running. Something is missing from the treasury, and the shortfall is exactly the size of one pair of hands.", "nlocks": 2, "ntheories": 5}, {"id": "jm02", "code": "CASE JM-02", "title": "The Missing Boy", "period": "Jerusalem · c. AD 8", "colour": "#5c7d8a", "poster": "poster_jm02", "teaser": "A family leaves the festival in a company of a hundred relatives. A full day out, a twelve-year-old is not among them. It takes two exhausted parents three days to find a child who was never hiding.", "nlocks": 2, "ntheories": 5}, {"id": "jm03", "code": "CASE JM-03", "title": "The Bush That Would Not Burn", "period": "Horeb · undated", "colour": "#7d5c2f", "poster": "poster_jm03", "teaser": "A shepherd turns aside to look at a burning bush — not because it is burning, but because it is still there. The site was surveyed afterwards. There is no ash on that hillside at all.", "nlocks": 2, "ntheories": 5}, {"id": "jm04", "code": "CASE JM-04", "title": "The Judgment", "period": "Jerusalem · c. 960 BC", "colour": "#7d6b4a", "poster": "poster_jm04", "teaser": "Two women, one living child, and not a single witness, document or mark to tell them apart. Both tell exactly the same story with the names reversed. The Bureau regards this as the hardest evidential problem in the archive.", "nlocks": 2, "ntheories": 5}, {"id": "jm05", "code": "CASE JM-05", "title": "The Writing on the Wall", "period": "Babylon · 539 BC", "colour": "#4a2f6b", "poster": "poster_jm05", "teaser": "A thousand nobles at a feast, and a hand that writes four words on the plaster and stops. The finest scholars in the empire can pronounce every word and cannot tell the king what any of it means. By morning he is dead.", "nlocks": 2, "ntheories": 5}, {"id": "jm06", "code": "CASE JM-06", "title": "The Walls", "period": "Jericho · c. 1400 BC", "colour": "#8a6a4a", "poster": "poster_jm06", "teaser": "For six days an army walks once around a walled city in complete silence and goes back to camp. On the seventh it walks round seven times, makes one sound, and the wall falls — outward, all the way round, except for one house.", "nlocks": 2, "ntheories": 5}, {"id": "jm09", "code": "CASE JM-09", "title": "The Mouldy Bread", "period": "Gibeon · c. 1400 BC", "colour": "#7d7a4a", "poster": "poster_jm09", "teaser": "Ambassadors arrive with split wineskins, worn-through sandals and dry crumbling bread as proof of a very long journey. A treaty is sworn. Three days later they turn out to live a day's walk away.", "nlocks": 2, "ntheories": 5}, {"id": "jm10", "code": "CASE JM-10", "title": "The Ten Blows", "period": "Egypt · c. 1450 BC", "colour": "#6b2f2f", "poster": "poster_jm10", "teaser": "Ten disasters strike Egypt inside a year. Pharaoh's own magicians reproduce the first two, fail at the third, and by the fourth something is happening that no chain of natural causes can account for.", "nlocks": 2, "ntheories": 5}, {"id": "jm11", "code": "CASE JM-11", "title": "The Cart That Chose Its Own Road", "period": "Philistia · c. 1100 BC", "colour": "#8a4a2f", "poster": "poster_jm11", "teaser": "Seven months after capturing Israel's ark, the Philistines are sick of it. Their own priests design a test to find out whether the chest is really the cause — and build it so that it could easily say no.", "nlocks": 2, "ntheories": 5}, {"id": "jm13", "code": "CASE JM-13", "title": "The Twelve Reports", "period": "Kadesh · c. 1445 BC", "colour": "#5c6b3a", "poster": "poster_jm13", "teaser": "Twelve men survey one country for forty days and come back with a bunch of grapes that takes two of them to carry — and two reports that cannot both be right. Except that every fact in them is identical.", "nlocks": 2, "ntheories": 5}, {"id": "jm14", "code": "CASE JM-14", "title": "The Crossing", "period": "The Sea of Reeds · c. 1446 BC", "colour": "#2f5c6b", "poster": "poster_jm14", "teaser": "A column of refugees is trapped between deep water and the fastest army in the world. By morning the refugees are across, and the army is not there at all.", "nlocks": 2, "ntheories": 5}, {"id": "jm15", "code": "CASE JM-15", "title": "The Witnesses Who Would Not Agree", "period": "Jerusalem · c. AD 30", "colour": "#5c3a3a", "poster": "poster_jm15", "teaser": "A court needs two witnesses whose accounts agree. It has plenty of witnesses, a whole night, and every advantage — and it cannot get two of them to say the same thing.", "nlocks": 2, "ntheories": 5}, {"id": "jm16", "code": "CASE JM-16", "title": "The Bread on the Ground", "period": "The wilderness of Sin · c. 1446 BC", "colour": "#8a7a4a", "poster": "poster_jm16", "teaser": "A substance appears on the ground each morning and feeds a nation for forty years. Every natural explanation fits — right up until the seventh day.", "nlocks": 2, "ntheories": 5}, {"id": "jm18", "code": "CASE JM-18", "title": "The Contest on Carmel", "period": "Mount Carmel · c. 860 BC", "colour": "#8a4a2f", "poster": "poster_jm18", "teaser": "One prophet against four hundred and fifty, one altar each, and a rule agreed in front of the whole nation. Then the challenger soaks his own altar until the trench around it overflows.", "nlocks": 2, "ntheories": 5}, {"id": "jm20", "code": "CASE JM-20", "title": "The Rock at Meribah", "period": "Kadesh · c. 1407 BC", "colour": "#6b5c4a", "poster": "poster_jm20", "teaser": "Water comes out of a rock in front of the whole nation, and the man who produced it is told he will not enter the country he has spent forty years walking toward. The Bureau is asked why.", "nlocks": 2, "ntheories": 5}];

const CASE_REG = {};        // id -> the case as the reader should see it
const CASE_BASE = {};       // id -> the untouched medium-level case
const CASE_PENDING = {};    // id -> the promise fetching it

/* ------------------------------------------------------------------
   READING LEVEL

   Every case is written once, at "medium" — the Year 7-8 voice. An easy
   pack (cases/<id>.easy.js) carries nothing but replacement wording, keyed
   by the same ids: same evidence, same logic, same lock codes, shorter
   sentences. Switching level rebuilds the case from the untouched base and
   lays the easy wording over the top, so nothing is ever lost by toggling
   back and forth.
   ------------------------------------------------------------------ */
const EASY_REG = {};        // id -> the easy wording pack, once it is here
const EASY_PENDING = {};
const LEVEL_KEY = "cs-reading-level";

let LEVEL = "medium";
try{ if(localStorage.getItem(LEVEL_KEY) === "easy") LEVEL = "easy"; }catch(e){}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* Lay an easy pack over a case.

   Objects merge key by key. An array in the case that is addressed by an
   object in the pack is matched up by id — so items, theories, locks,
   verdicts and the grid's own rows and columns can all be rewritten by
   naming the ones you want to change and leaving the rest alone. */
function mergeEasy(base, easy){
  for(const k in easy){
    const e = easy[k], b = base[k];
    if(Array.isArray(b) && e && typeof e === "object" && !Array.isArray(e)){
      b.forEach(row => { if(row && row.id && e[row.id]) mergeEasy(row, e[row.id]); });
    } else if(Array.isArray(e)){
      base[k] = clone(e);
    } else if(e && typeof e === "object" && b && typeof b === "object"){
      mergeEasy(b, e);
    } else {
      base[k] = e;
    }
  }
  return base;
}

function buildCase(id){
  const base = CASE_BASE[id];
  if(!base) return null;
  if(LEVEL !== "easy" || !EASY_REG[id]) return base;
  return mergeEasy(clone(base), EASY_REG[id]);
}

/* Called at the foot of every case file. */
function registerCase(c){
  CASE_BASE[c.id] = c;
  CASE_REG[c.id]  = buildCase(c.id);
}

/* Called at the foot of every easy pack. */
function registerEasy(id, pack){
  EASY_REG[id] = pack;
  if(CASE_BASE[id]) CASE_REG[id] = buildCase(id);
}

function hasEasy(id){ return !!EASY_REG[id] || (EASY_AVAILABLE.indexOf(id) >= 0); }

/* Which cases have an easy pack written, and the handful of strings the shelf
   needs before any case has been fetched. Both filled in by the build. */
const EASY_AVAILABLE = ["jm02", "jm03", "jm04", "jm05", "jm06", "jm08", "jm09", "jm19", "jm20", "jm33", "jm47"];
const EASY_STUBS     = {"jm02": {"teaser": "A family leaves the festival in a group of a hundred relatives. A day later, a twelve-year-old is not among them. It takes two exhausted parents three days to find a boy who was never even hiding.", "introSub": "A day out, and the boy is not with the group."}, "jm03": {"teaser": "A shepherd stops to look at a burning bush — not because it is burning, but because it is still there. The place was checked afterwards. There is no ash on that hillside at all.", "introSub": "It was burning. Nothing was being used up. He went to find out why."}, "jm04": {"teaser": "Two women, one living baby, and not one witness, document or mark to tell them apart. Both tell exactly the same story with the names swapped. We think this is the hardest case in the whole archive.", "introSub": "Two stories that match exactly. No witnesses. Nothing to weigh up."}, "jm05": {"teaser": "A thousand important guests at a feast, and a hand that writes four words on the wall and stops. The cleverest scholars in the empire can say every word out loud and still cannot tell the king what any of it means. By morning he is dead.", "introSub": "Four words. A thousand witnesses. Nobody can explain it."}, "jm06": {"teaser": "For six days an army walks once round a walled city in complete silence and goes back to camp. On the seventh day it walks round seven times, makes one sound, and the wall falls — outwards, all the way round, except for one house.", "introSub": "Six days of walking. No siege, no ladders, no attack."}, "jm08": {"teaser": "Jericho fell in a week. Days later a small village stopped the same army dead, and thirty-six men died running away. Something is missing from the treasury, and the amount missing is exactly what one pair of hands could carry.", "introSub": "An army that walked through a city has just been beaten by a village."}, "jm09": {"teaser": "Ambassadors turn up with split wineskins, worn-out sandals and dry crumbling bread, as proof of a very long journey. A peace treaty is signed. Three days later they turn out to live a day's walk away.", "introSub": "A treaty signed because of some worn-out sandals."}, "jm19": {"teaser": "A riddle only one man on earth could answer — and thirty men answered it perfectly, an hour before the deadline. Nobody saw. Nobody was told. Somebody is lying.", "introSub": "One private memory. Thirty men who needed it. Seven days."}, "jm20": {"teaser": "Water pours out of a rock in front of the whole nation. Then the man who did it is told he will never enter the land he has been walking towards for forty years.", "introSub": "Two orders, thirty-eight years apart. One word is different."}, "jm33": {"teaser": "A sealed tomb, four Roman soldiers on guard, and no body in the morning. Five explanations have been offered. Only one of them survives the file.", "introSub": "A sealed tomb. Four guards. No body."}, "jm47": {"teaser": "Five ambushes planned in secret. Five times the enemy simply did not turn up. The king of Aram is sure one of his own officers is talking — and he is about to hear something far stranger.", "introSub": "Five secret plans. Five empty ambushes. Somebody is talking."}};

/* A shelf stub at the level in force. */
function stubAtLevel(cdef){
  if(LEVEL !== "easy" || !EASY_STUBS[cdef.id]) return cdef;
  return Object.assign({}, cdef, EASY_STUBS[cdef.id]);
}

function loadEasy(id){
  if(EASY_REG[id]) return Promise.resolve(EASY_REG[id]);
  if(EASY_AVAILABLE.indexOf(id) < 0) return Promise.resolve(null);
  if(EASY_PENDING[id]) return EASY_PENDING[id];
  EASY_PENDING[id] = new Promise(resolve=>{
    const s = document.createElement("script");
    s.src = "cases/" + id + ".easy.js";
    s.async = true;
    s.onload  = ()=> resolve(EASY_REG[id] || null);
    s.onerror = ()=> resolve(null);          // fall back to the medium wording
    document.head.appendChild(s);
  });
  return EASY_PENDING[id];
}

/* Set the level, refit every case already in memory, and report whether the
   caller needs to redraw. */
function setLevel(lvl){
  LEVEL = (lvl === "easy") ? "easy" : "medium";
  try{ localStorage.setItem(LEVEL_KEY, LEVEL); }catch(e){}
  Object.keys(CASE_BASE).forEach(id => { CASE_REG[id] = buildCase(id); });
}

function caseLoaded(id){ return !!CASE_REG[id]; }

/* Fetch the case itself. */
function fetchCase(id){
  if(CASE_REG[id]) return Promise.resolve(CASE_REG[id]);
  if(CASE_PENDING[id]) return CASE_PENDING[id];
  CASE_PENDING[id] = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "cases/" + id + ".js";
    s.async = true;
    s.onload = ()=> CASE_REG[id]
      ? resolve(CASE_REG[id])
      : reject(new Error("the case file loaded but registered nothing"));
    s.onerror = ()=> reject(new Error("could not fetch cases/" + id + ".js"));
    document.head.appendChild(s);
  });
  CASE_PENDING[id].catch(()=>{ delete CASE_PENDING[id]; });   // let them try again
  return CASE_PENDING[id];
}

/* What the rest of the app calls: the case, at the reading level in force. A
   missing easy pack is not an error — the case simply stays at medium. */
function loadCase(id){
  return fetchCase(id).then(()=>{
    if(LEVEL !== "easy" || EASY_REG[id]) return CASE_REG[id];
    return loadEasy(id).then(()=>{ CASE_REG[id] = buildCase(id); return CASE_REG[id]; });
  });
}

/* Shown when a case file cannot be fetched — nearly always because the page was
   opened straight off the disk rather than through a web address. */
const CASE_LOAD_HELP =
  "This build keeps every case in its own file, so it needs to be served from a " +
  "web address — GitHub Pages, or a local server — rather than opened straight " +
  "from the disk. The single file in standalone/ has everything inside it and " +
  "works anywhere, including off a USB stick.";

<script>
"use strict";
/* ============================================================
   THE BIBLE
   World English Bible (WEB) — public domain, no permission needed.
   Loaded on demand: fetched as bible.json in the split build,
   or decoded from an inlined gzip blob in the single-file build.
   ============================================================ */

const BIBLE_BOOKS = [{"n":"Genesis","a":"Gen","t":"OT","c":50},{"n":"Exodus","a":"Ex","t":"OT","c":40},{"n":"Leviticus","a":"Lev","t":"OT","c":27},{"n":"Numbers","a":"Num","t":"OT","c":36},{"n":"Deuteronomy","a":"Deut","t":"OT","c":34},{"n":"Joshua","a":"Josh","t":"OT","c":24},{"n":"Judges","a":"Judg","t":"OT","c":21},{"n":"Ruth","a":"Ruth","t":"OT","c":4},{"n":"1 Samuel","a":"1Sam","t":"OT","c":31},{"n":"2 Samuel","a":"2Sam","t":"OT","c":24},{"n":"1 Kings","a":"1Kgs","t":"OT","c":22},{"n":"2 Kings","a":"2Kgs","t":"OT","c":25},{"n":"1 Chronicles","a":"1Chr","t":"OT","c":29},{"n":"2 Chronicles","a":"2Chr","t":"OT","c":36},{"n":"Ezra","a":"Ezra","t":"OT","c":10},{"n":"Nehemiah","a":"Neh","t":"OT","c":13},{"n":"Esther","a":"Est","t":"OT","c":10},{"n":"Job","a":"Job","t":"OT","c":42},{"n":"Psalms","a":"Ps","t":"OT","c":150},{"n":"Proverbs","a":"Prov","t":"OT","c":31},{"n":"Ecclesiastes","a":"Eccl","t":"OT","c":12},{"n":"Song of Solomon","a":"Song","t":"OT","c":8},{"n":"Isaiah","a":"Isa","t":"OT","c":66},{"n":"Jeremiah","a":"Jer","t":"OT","c":52},{"n":"Lamentations","a":"Lam","t":"OT","c":5},{"n":"Ezekiel","a":"Ezek","t":"OT","c":48},{"n":"Daniel","a":"Dan","t":"OT","c":12},{"n":"Hosea","a":"Hos","t":"OT","c":14},{"n":"Joel","a":"Joel","t":"OT","c":3},{"n":"Amos","a":"Amos","t":"OT","c":9},{"n":"Obadiah","a":"Obad","t":"OT","c":1},{"n":"Jonah","a":"Jonah","t":"OT","c":4},{"n":"Micah","a":"Mic","t":"OT","c":7},{"n":"Nahum","a":"Nah","t":"OT","c":3},{"n":"Habakkuk","a":"Hab","t":"OT","c":3},{"n":"Zephaniah","a":"Zeph","t":"OT","c":3},{"n":"Haggai","a":"Hag","t":"OT","c":2},{"n":"Zechariah","a":"Zech","t":"OT","c":14},{"n":"Malachi","a":"Mal","t":"OT","c":4},{"n":"Matthew","a":"Matt","t":"NT","c":28},{"n":"Mark","a":"Mark","t":"NT","c":16},{"n":"Luke","a":"Luke","t":"NT","c":24},{"n":"John","a":"John","t":"NT","c":21},{"n":"Acts","a":"Acts","t":"NT","c":28},{"n":"Romans","a":"Rom","t":"NT","c":16},{"n":"1 Corinthians","a":"1Cor","t":"NT","c":16},{"n":"2 Corinthians","a":"2Cor","t":"NT","c":13},{"n":"Galatians","a":"Gal","t":"NT","c":6},{"n":"Ephesians","a":"Eph","t":"NT","c":6},{"n":"Philippians","a":"Phil","t":"NT","c":4},{"n":"Colossians","a":"Col","t":"NT","c":4},{"n":"1 Thessalonians","a":"1Thess","t":"NT","c":5},{"n":"2 Thessalonians","a":"2Thess","t":"NT","c":3},{"n":"1 Timothy","a":"1Tim","t":"NT","c":6},{"n":"2 Timothy","a":"2Tim","t":"NT","c":4},{"n":"Titus","a":"Titus","t":"NT","c":3},{"n":"Philemon","a":"Phlm","t":"NT","c":1},{"n":"Hebrews","a":"Heb","t":"NT","c":13},{"n":"James","a":"Jas","t":"NT","c":5},{"n":"1 Peter","a":"1Pet","t":"NT","c":5},{"n":"2 Peter","a":"2Pet","t":"NT","c":3},{"n":"1 John","a":"1John","t":"NT","c":5},{"n":"2 John","a":"2John","t":"NT","c":1},{"n":"3 John","a":"3John","t":"NT","c":1},{"n":"Jude","a":"Jude","t":"NT","c":1},{"n":"Revelation","a":"Rev","t":"NT","c":22}];

const BIBLE = {
  books: BIBLE_BOOKS,
  data: null,          // {text:{abbr:[[verse,…],…]}} — fetched on demand
  loading: null,
  byName: {},          // lower-case name/alias -> abbr
  pref: { lord: false, book: "Gen", chapter: 1 }
};

const BIBLE_PREF_KEY = "jm_bible_v1";

function biblePrefLoad(){
  try{ Object.assign(BIBLE.pref, JSON.parse(localStorage.getItem(BIBLE_PREF_KEY)||"{}")); }catch(e){}
}
function biblePrefSave(){
  try{ localStorage.setItem(BIBLE_PREF_KEY, JSON.stringify(BIBLE.pref)); }catch(e){}
}

/* ---------------- loading ---------------- */
async function bibleLoad(){
  if(BIBLE.data) return BIBLE.data;
  if(BIBLE.loading) return BIBLE.loading;
  BIBLE.loading = (async ()=>{
    let json;
    if(typeof window.__BIBLE_GZ__ === "string"){
      if(!("DecompressionStream" in window)) throw new Error("nostream");
      const bin = atob(window.__BIBLE_GZ__);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream("gzip");
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      json = await new Response(stream).text();
    } else {
      const r = await fetch("bible.json");
      if(!r.ok) throw new Error("fetch " + r.status);
      json = await r.text();
    }
    BIBLE.data = JSON.parse(json);
    return BIBLE.data;
  })();
  return BIBLE.loading;
}

/* ---------------- name index (available before the text is fetched) ---------------- */
(function(){
  BIBLE.books.forEach(b=>{
    BIBLE.byName[b.n.toLowerCase()] = b.a;
    BIBLE.byName[b.a.toLowerCase()] = b.a;
  });
  Object.entries({
    "psalm":"Ps", "song of songs":"Song", "canticles":"Song",
    "revelations":"Rev", "acts of the apostles":"Acts",
    "1 kgs":"1Kgs", "2 kgs":"2Kgs", "1 sam":"1Sam", "2 sam":"2Sam",
    "1 cor":"1Cor", "2 cor":"2Cor", "1 chron":"1Chr", "2 chron":"2Chr"
  }).forEach(([k,v])=>{ BIBLE.byName[k]=v; });
})();

/* ---------------- text helpers ---------------- */
const bookByAbbr = a => BIBLE.books.find(b=>b.a===a);
function bibleVerses(abbr, ch){
  const b = BIBLE.data.text[abbr];
  return (b && b[ch-1]) ? b[ch-1] : [];
}
function divineName(t){
  if(!BIBLE.pref.lord) return t;
  return t.replace(/\bLord Yahweh\b/g, "Lord GOD")
          .replace(/\bYahweh\b/g, "the LORD")
          .replace(/\bYah\b/g, "the LORD");
}

/* ---------------- reference parsing ---------------- */
function bibleBookPattern(){
  const names = BIBLE.books.map(b=>b.n).concat(["Psalm","Song of Songs"]);
  names.sort((a,b)=>b.length-a.length);
  return names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
}
let BIBLE_RE = null;
function bibleRegex(){
  if(!BIBLE_RE){
    // Book 12  ·  Book 12:3  ·  Book 12:3–8  ·  Book 12:3 – 13:8  ·  Book 12–13
    BIBLE_RE = new RegExp(
      "\\b(" + bibleBookPattern() + ")\\s+(\\d+)" +
      "(?::(\\d+))?" +
      "(?:\\s*[–—-]\\s*(?:(\\d+):)?(\\d+))?", "g");
  }
  return BIBLE_RE;
}
function parseRefMatch(m){
  const abbr = BIBLE.byName[m[1].toLowerCase()];
  if(!abbr) return null;
  const bk = bookByAbbr(abbr);
  const ch = Math.min(parseInt(m[2],10), bk.c);
  const v1 = m[3] ? parseInt(m[3],10) : null;
  let v2 = null, ch2 = null;
  if(m[5]){                      // there is a range end
    if(m[4]) { ch2 = parseInt(m[4],10); v2 = parseInt(m[5],10); }
    else if(v1 !== null) v2 = parseInt(m[5],10);
  }
  return {abbr, ch, v1, v2, ch2, label:m[0]};
}

/* Wrap every scripture reference in a container with a clickable link. */
const SKIP_TAGS = new Set(["A","TEXTAREA","INPUT","SCRIPT","STYLE","BUTTON","SELECT"]);
function linkifyRefs(root){
  if(!root) return;
  const re = bibleRegex();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.length < 5) return NodeFilter.FILTER_REJECT;
      let p = n.parentElement;
      while(p && p !== root){
        if(SKIP_TAGS.has(p.tagName) || p.isContentEditable) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  let n; while((n = walker.nextNode())) targets.push(n);
  targets.forEach(node=>{
    re.lastIndex = 0;
    if(!re.test(node.nodeValue)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while((m = re.exec(node.nodeValue))){
      const ref = parseRefMatch(m);
      if(!ref) continue;
      if(m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
      const a = document.createElement("a");
      a.className = "bref";
      a.textContent = m[0];
      a.title = "Open the Bible here";
      a.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); openBible(ref); });
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if(!frag.childNodes.length) return;
    if(last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---------------- the reader ---------------- */
async function openBible(ref){
  const o = overlay(`<div class="bibloading">Opening the Bible…</div>`, "wide bibsheet");
  try{ await bibleLoad(); }
  catch(err){
    o.querySelector(".body").innerHTML =
      `<div class="doc-kind">Bible</div><div class="doc-title">The Bible could not be loaded</div>
       <div class="doc-body"><p>${err.message==="nostream"
        ? "This browser is too old to unpack the built-in Bible. Use the version hosted on the web, which loads it as a separate file."
        : "The Bible file could not be fetched. If you are opening this page straight from your hard drive, use the single-file version instead, or put the folder on a web server."}</p></div>`;
    return;
  }
  if(ref){ BIBLE.pref.book = ref.abbr; BIBLE.pref.chapter = ref.ch; biblePrefSave(); }
  const state = { abbr: BIBLE.pref.book, ch: BIBLE.pref.chapter, hit: ref || null, mode: "read" };

  const rail = () => ["OT","NT"].map(t=>
    `<h6>${t==="OT"?"Old Testament":"New Testament"}</h6>` +
    BIBLE.books.filter(b=>b.t===t).map(b=>
      `<button data-b="${b.a}" class="${b.a===state.abbr?"on":""}">${b.n}</button>`).join("")
  ).join("");

  const chapters = () => {
    const bk = bookByAbbr(state.abbr);
    return Array.from({length:bk.c},(_,i)=>
      `<button data-c="${i+1}" class="${i+1===state.ch?"on":""}">${i+1}</button>`).join("");
  };

  const chapterHtml = () => {
    const bk = bookByAbbr(state.abbr);
    const vs = bibleVerses(state.abbr, state.ch);
    const h = state.hit && state.hit.abbr===state.abbr && state.hit.ch===state.ch ? state.hit : null;
    const from = h && h.v1 ? h.v1 : 0;
    const to   = h && h.v1 ? (h.ch2 ? vs.length : (h.v2 || h.v1)) : -1;
    return `<div class="bibref">${bk.n} ${state.ch}</div><div class="bibbody">` +
      vs.map((t,i)=>{
        const n = i+1, on = n>=from && n<=to;
        return `<span class="bv${on?" hit":""}" id="v${n}"><sup>${n}</sup>${esc(divineName(t))}</span>`;
      }).join("") + `</div>`;
  };

  const draw = ()=>{
    const bk = bookByAbbr(state.abbr);
    o.querySelector(".body").innerHTML = `
      <div class="bibhead">
        <div>
          <div class="doc-kind">The Bible Investigation Bureau Reading Room</div>
          <div class="doc-title">The Bible</div>
        </div>
        <div class="bibtools">
          <input class="bibsearch" id="bibQ" placeholder="Search the Bible…" value="">
          <label class="bibtoggle"><input type="checkbox" id="bibLord" ${BIBLE.pref.lord?"checked":""}> print “the LORD”</label>
        </div>
      </div>
      <div class="rule"></div>
      <div class="bibwrap">
        <div class="bibrail">${rail()}</div>
        <div class="bibmain" id="bibMain">
          <div class="bibchaps">${chapters()}</div>
          ${chapterHtml()}
        </div>
      </div>
      <div class="bibfoot">
        <button class="btn ghost" id="bibPrev">‹ Previous chapter</button>
        <button class="btn ghost" id="bibNext">Next chapter ›</button>
        <span class="bibnote">World English Bible — public domain. This translation prints God's personal name as “Yahweh”; tick the box above to read “the LORD” instead, as most classroom Bibles do.</span>
      </div>`;
    wire();
    const main = o.querySelector("#bibMain");
    const hit = o.querySelector(".bv.hit");
    if(hit) main.scrollTop = Math.max(0, hit.offsetTop - main.offsetTop - 70);
    else main.scrollTop = 0;
  };

  const go = (abbr, ch, hit)=>{
    state.abbr = abbr; state.ch = ch; state.hit = hit || null;
    BIBLE.pref.book = abbr; BIBLE.pref.chapter = ch; biblePrefSave();
    draw();
  };

  const step = d => {
    const list = BIBLE.books;
    let i = list.findIndex(b=>b.a===state.abbr), ch = state.ch + d;
    if(ch < 1){ i = (i-1+list.length)%list.length; ch = list[i].c; }
    else if(ch > list[i].c){ i = (i+1)%list.length; ch = 1; }
    go(list[i].a, ch);
  };

  const search = q =>{
    const needle = q.trim().toLowerCase();
    if(needle.length < 3) return;
    const out = [];
    outer:
    for(const b of BIBLE.books){
      const chs = BIBLE.data.text[b.a];
      for(let c=0;c<chs.length;c++){
        const vs = chs[c];
        for(let v=0;v<vs.length;v++){
          const t = divineName(vs[v]);
          if(t.toLowerCase().includes(needle)){
            out.push({b:b.a, n:b.n, c:c+1, v:v+1, t});
            if(out.length >= 120) break outer;
          }
        }
      }
    }
    const mark = t =>{
      const i = t.toLowerCase().indexOf(needle);
      if(i < 0) return esc(t);
      const s = Math.max(0, i-70);
      return (s?"… ":"") + esc(t.slice(s,i)) + "<mark>" + esc(t.slice(i,i+needle.length)) + "</mark>" +
             esc(t.slice(i+needle.length, i+needle.length+110)) + "…";
    };
    o.querySelector(".bibwrap").innerHTML =
      `<div class="bibresults" style="flex:1">
        <div class="bibref">${out.length ? out.length + (out.length>=120?"+":"") + " results for “" + esc(q) + "”" : "Nothing found for “" + esc(q) + "”"}</div>
        ${out.map((r,i)=>`<button class="bibresult" data-i="${i}"><b>${r.n} ${r.c}:${r.v}</b>${mark(r.t)}</button>`).join("")}
      </div>`;
    o.querySelectorAll(".bibresult").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const r = out[+btn.dataset.i];
        go(r.b, r.c, {abbr:r.b, ch:r.c, v1:r.v, v2:r.v});
      });
    });
  };

  function wire(){
    o.querySelectorAll(".bibrail button").forEach(b=>
      b.addEventListener("click", ()=>go(b.dataset.b, 1)));
    o.querySelectorAll(".bibchaps button").forEach(b=>
      b.addEventListener("click", ()=>go(state.abbr, +b.dataset.c)));
    o.querySelector("#bibPrev").addEventListener("click", ()=>step(-1));
    o.querySelector("#bibNext").addEventListener("click", ()=>step(1));
    o.querySelector("#bibLord").addEventListener("change", e=>{
      BIBLE.pref.lord = e.target.checked; biblePrefSave(); draw();
    });
    const q = o.querySelector("#bibQ");
    q.addEventListener("keydown", e=>{ if(e.key==="Enter") search(q.value); });
  }

  draw();
}

</script>
<script>
"use strict";
/* ============================================================
   THE PAPER EDITION
   Every case can be printed, cut out and run with no device at all.
   Everything here is generated from the case object, so a new case
   gets its paper edition for nothing.
   ============================================================ */

const forPrint = html => (html||"")
  .replace(/Click (?:the [a-z ]+|to)[^<.]*enlarge[^<.]*\.?/gi, "")
  .replace(/<div class="cap">\s*<\/div>/g, "")
  .replace(/<div class="plate">\s*<svg viewBox="0 0 (\d+(?:\.\d+)?) (\d+(?:\.\d+)?)"/g,
    (m, w, h) => m.replace('class="plate"', 'class="plate ' + plateShape(+w / +h) + '"'));

/* On paper a plate is sized by its width, because that is what the page limits.
   Its shape decides how wide it can be before it grows too tall for one sheet. */
function plateShape(ratio){
  if(ratio >= 1.3) return "wideplate";     // the 3:2 field plates
  if(ratio >= 0.9) return "squareplate";
  return "tallplate";                      // upright paper props
}

const stageItems = (cdef, s) => cdef.items.filter(i=>i.stage===s);

/* decoy labels so the envelope you open is not simply the only one there */
function decoyCodes(code){
  const d = new Set([code]);
  const digits = code.split("");
  while(d.size < 4){
    const a = digits.slice();
    const i = Math.floor(Math.random()*a.length), j = Math.floor(Math.random()*a.length);
    [a[i],a[j]] = [a[j],a[i]];
    d.add(a.join(""));
    if(d.size < 4) d.add(String((parseInt(code,10) + 1 + d.size) % 10000).padStart(code.length,"0"));
  }
  return [...d].sort();
}
function decoyWords(word){
  const pool = ["HARVEST","LANTERN","MEASURE","SHUTTER","GARLAND","TRAVAIL","CISTERN","MANTLE",
                "PLEDGE","FURROW","BRAZIER","THISTLE","QUARRY","VESTURE","SANDAL","BEACON"];
  const same = pool.filter(w=>w.length===word.length && w!==word);
  const out = [word, ...same.slice(0,3)];
  while(out.length < 4) out.push(pool.find(w=>!out.includes(w)));
  return out.sort();
}

/* ---------------- the certificate ---------------- */
function certificateHtml(cdef, names, dateStr, verdict){
  return `<section class="pp-page pp-cert">
    <div class="cert">
      <div class="cert-in">
        ${SVG.finalSeal}
        <div class="cert-soc">The Bible Investigation Bureau · Department of Unsolved Antiquities</div>
        <div class="cert-h">Certificate of Investigation</div>
        <div class="cert-sub">This is to record that the case below was opened, worked and closed</div>
        <div class="cert-names">${names || "&nbsp;"}</div>
        <div class="cert-nl">investigator${(names||"").includes(",")||(names||"").includes("&")?"s":""}</div>
        <div class="cert-case">${cdef.code}</div>
        <div class="cert-title">${cdef.title}</div>
        <div class="cert-where">${cdef.period}</div>
        <div class="cert-verdict"><b>Conclusion filed:</b> ${verdict || cdef.teacher.conclusion}</div>
        <div class="cert-sign">
          <div><div class="cert-line"></div><span>A. Thorne · Case Supervisor</span></div>
          <div><div class="cert-line"></div><span>Teacher</span></div>
          <div><div class="cert-line">${dateStr||""}</div><span>Date closed</span></div>
        </div>
      </div>
    </div>
  </section>`;
}

function openCertificate(cdef){
  const st = stateFor(cdef.id);
  const names = (st.sheet && st.sheet.names) ? st.sheet.names : "";
  const d = new Date();
  const date = `${d.getDate()} ${["January","February","March","April","May","June","July",
    "August","September","October","November","December"][d.getMonth()]} ${d.getFullYear()}`;
  const o = overlay(`<div class="ppdoc">${certificateHtml(cdef, names, date)}</div>
    <div class="noprint" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="certPrint">Print the certificate</button>
      <span class="small">It fills in the names from your answer sheet. Print it and put it in your case folder.</span>
    </div>`, "wide bibsheet");
  o.classList.add("printme");
  o.querySelector("#certPrint").addEventListener("click", ()=>window.print());
}

/* ---------------- the whole paper pack ---------------- */
function printPack(cdef){
  const L1 = cdef.locks[0], L2 = cdef.locks[1];
  const s0 = stageItems(cdef,0), s1 = stageItems(cdef,1), s2 = stageItems(cdef,2);
  /* A document carrying a plate prints as a full sheet rather than a cut-out
     card. The plates carry typeset labels that have to be readable on paper, so
     they run the full width of the page — which makes those documents taller
     than a card can be. The team lays the sheet on the desk whole. */
  const card = (it, band) => {
    const sheet = /class="plate"/.test(it.body);
    return `
    <article class="pp-card${sheet ? " sheet" : ""}">
      ${band?`<div class="pp-band">${band}</div>`:""}
      <div class="doc-kind">${it.kind}</div>
      <div class="pp-ct">${it.title}</div>
      ${it.sub?`<div class="doc-sub">${it.sub}</div>`:""}
      ${sheet ? `<div class="pp-keep">◻ A full sheet — use it whole, do not cut it up</div>` : ""}
      <div class="doc-body">${forPrint(it.body)}</div>
      ${sheet ? "" : `<div class="pp-cut">✂ cut here</div>`}
    </article>`;
  };

  const step = (n, h, body) => `<div class="pp-step"><b>${n}</b><div><h5>${h}</h5>${body}</div></div>`;

  const codes = decoyCodes(L1.code);
  const words = decoyWords(L2.code);

  const html = `<div class="ppdoc">

  <!-- ============ COVER ============ -->
  <section class="pp-page pp-cover">
    <div class="pp-soc">The Bible Investigation Bureau · Department of Unsolved Antiquities</div>
    <div class="pp-code">${cdef.code}</div>
    <h1>${cdef.title}</h1>
    <div class="pp-where">${cdef.period}</div>
    <div class="pp-art">${cdef.poster && SVG[cdef.poster] ? SVG[cdef.poster] : ""}</div>
    <p class="pp-teaser">${cdef.teaser}</p>
    <div class="pp-stamp">PAPER EDITION · NO DEVICE REQUIRED</div>
    <div class="pp-label">
      <div class="pp-labelin">
